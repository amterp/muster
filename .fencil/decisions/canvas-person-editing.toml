reversibility = "two-way"
answer = '''
Not in the first version. The person reads, selects and copies; only an agent writes. Editing by the person gets a design of its own afterwards.
'''
why = '''
The agent's half is useful alone and is the part the owner's whiteboard use needs first. How a person's edit reaches the agent, as a message or as a changed document, is a separate design.
'''

