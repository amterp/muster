id = "needs-you-strip-source"
question = "What decides which agents are in the Needs you strip, and in what order?"
tags = ["ui", "agent-list", "attention"]
paths = ["crates/muster-core/src/attention.rs", "Sources/MusterMac/Sidebar.swift"]

[[revisions]]
n = 1
date = 2026-11-08
recorded_by = "claude-code"
discussion = "ui-redesign-2026-11"
level = "agent"
proposed_by = "agent"
reversibility = "two-way"
answer = '''
The core's ranking of what asks for the person, `Attention::asking()`, exactly: blocked, then
stuck, then messages for the human, then programs' notifications, then finished and unseen, and
within each whoever asked first. So the strip leaves out what that list leaves out: a quiet pane, a
pane the focused window is showing, and anything on a machine the window cannot reach.'''
why = '''
One list means the strip, the focus_asking chord and the banners never disagree about who is
waiting. A second rule for the strip would have to be kept in step with the first by hand. The
mock-ups showed a blocked pane in the strip while it was on screen; under this rule it leaves the
strip while the person is looking at it, whose header already says it is blocked.'''

  [[revisions.evidence]]
  by = "agent"
  date = 2026-11-08
  note = "The implementation plan for the redesign, reviewed by a Codex agent (gpt-6.1-sol, xhigh) over four rounds, which raised no finding against this choice."
