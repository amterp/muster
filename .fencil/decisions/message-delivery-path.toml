  quote = "Im less confident about the Stop thing? ... so theoretically we could just always install the hook ... if agent A wants to msg agent B, it will just do the msg, and then muster will take care of how to get that message to B, whether that's thru this if-unread mechaanism (which will likely be the delivery mechanism if B is actively running) or I suppose messaging into the box like we do today, if the agent is idle"
  note = "Replying to the agent's proposal to ship both messaging hooks (PostToolUse and Stop) in the plugin, inert outside a group."

