reversibility = "two-way"
answer = '''
On its avatar in conversations and banners only. Callsigns in the agent list stay one neutral
color.'''
why = '''
In the agent list color means state, and an agent's own color beside its state icon would read as
a second state. Card a_2o5jIMI5J proposed sharing the color with the agent list's callsign; the
mock-ups showed the avatar-only version, and the owner has not ruled on the difference.'''

  [[revisions.evidence]]
  by = "agent"
