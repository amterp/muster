id = "agent-identity-colors"
question = "Where does an agent's own color appear?"
tags = ["ui", "messages", "agent-list"]
paths = ["Sources/MusterMac/Conversation.swift", "Sources/MusterMac/Banners.swift", "Sources/MusterMac/Sidebar.swift"]

[[revisions]]
n = 1
