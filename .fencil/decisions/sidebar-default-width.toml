answer = "280 pt, up from 200. Dragging the edge still sets any width."
why = '''
Direction A was drawn at 280 pt. At 200 a row holds its keycaps, its icon and a cut-off name, and
the directory, which the owner asked to see, is the first thing lost. The alternative was keeping
200 and letting rows show less until the person widens the list.'''

