id = "one-to-one-on-agent-row"
question = "Where does a conversation between the person and one agent with a pane appear?"
tags = ["ui", "agent-list", "messages"]
paths = ["Sources/MusterMac/Sidebar.swift"]

[[revisions]]
id = "y4ewbnp2"
date = 2026-11-08
recorded_by = "other"
discussion = "ui-redesign-2026-11"
level = "owner-decided"
proposed_by = "other"
reversibility = "two-way"
answer = '''
On that agent's row in the agent list, as an envelope with the unread count that opens the
conversation, rather than as an @human+<callsign> row under Messages. Messages keeps
conversations with several members and agents whose pane is gone.'''
why = '''
Messages listed nine @human+ rows in the owner's window on 2026-11-08, with one unread. The cost is
that a one-to-one conversation with nothing unread is reached from the agent's row rather than
from Messages.'''

  [[revisions.evidence]]
  by = "owner"
  date = 2026-11-08
  quote = "yes"
  note = "Asked, on its own: should a conversation between you and one agent instead show on that agent's own row, as a blue envelope with the unread count? Messages would then list only conversations with several members and agents whose pane is gone."

  [[revisions.evidence]]
  by = "owner"
  date = 2026-11-08
  quote = "I have answered that question in one-on-one conversations. The answer is yes."

[[revisions]]
id = "9a927x5h"
base = "y4ewbnp2"
date = 2026-11-10
recorded_by = "other"
discussion = "sidebar-entries-2026-11"
level = "owner-nodded"
proposed_by = "owner"
reversibility = "two-way"
answer = '''
On that agent's row in the agent list, as an envelope with the unread count that opens the
conversation. The agent list has no Messages section: a conversation with several members, or
with an agent whose pane is gone, has no row. Anything unread in one reaches the person through
the Needs you strip, and conversations-menus says how one is opened otherwise.'''
why = '''
With one-to-one conversations on their agents' rows, the Messages section still listed every
other group the person was in, most with nothing unread. The owner did not use it and it took
room from the agents. A group that wants the person already has a card in the Needs you strip.'''
change = "The Messages section is removed; conversations it listed are reached from menus."

  [[revisions.evidence]]
  by = "owner"
  date = 2026-11-09
  quote = "I actually think we also want to just delete the messages panel entirely. I'm just so unlikely to ever click on one that doesn't have an active thing in it. So I feel like the needs you panel will show ... any conversation that I need to talk to. ... Right now I just have a massive list of messages and ... it just takes up space and I don't use it and it's awkward UX."
  note = "Said while answering where the Needs you strip should sit, about the Messages section of the agent list, which listed the groups he is in."
