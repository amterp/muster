answer = '''
Yes: a Needs you strip under the agent list, which folds. It has one card for each agent that is
blocked, stuck, finished and unseen, or holding messages for the person, and is absent while
nothing needs anyone. An agent in the strip keeps its row in the list above, so the list never
reorders.'''
why = '''
At the top, the strip's coming and going moved every row of the list under it, and a card
arriving pushed the agents down while somebody was reading them. Under the list it takes its room
from the bottom, so the rows and their chords stay where the person's eye expects them, which is
what keeping each agent's row was for in the first place.'''
change = "The strip moves from the top of the agent list to under it."

