answer = '''
A ring with 20% of it left open, turning once every 4 seconds. With macOS set to reduce motion it
is the same ring held still.'''
why = '''
The ring before it was open for about a fifth too, but did not move, and read as a spinner that
had stalled. A slow turn says the agent is at work without drawing the eye the way a fast spinner
would. A play triangle, a pulsing dot, an orbiting bead, three dots and a still half-filled ring
were the alternatives; the owner asked for a spinner with less motion and set the gap and the
speed himself with two controls on the page.'''

