[workspace]
resolver = "3"
members = [
    "crates/conformance",
    "crates/herdr-harness",
    "crates/muster-bridge",
    "crates/muster-cli",
    "crates/muster-core",
    "crates/muster-herdr",
    "crates/muster-perf",
    "crates/muster-proto",
    "crates/muster-seam",
    "crates/muster-ssh",
    "crates/muster-vt",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
base64 = "0.22"
conformance = { path = "crates/conformance" }
flexid = "0.1"
herdr-harness = { path = "crates/herdr-harness" }
libc = "0.2"
muster-cli = { path = "crates/muster-cli" }
muster-core = { path = "crates/muster-core" }
muster-herdr = { path = "crates/muster-herdr" }
muster-proto = { path = "crates/muster-proto" }
muster-seam = { path = "crates/muster-seam" }
muster-ssh = { path = "crates/muster-ssh" }
muster-vt = { path = "crates/muster-vt" }
prost = "0.14"
serde_json = "1"
# Verifying the daemon this build pins, in the app rather than only in `./dev`. Pure Rust
# rather than forking a digest tool, because that tool is `shasum` on macOS and `sha256sum`
# everywhere else - a macOS-ism in the portable half is exactly what MIP-1 is for.
sha2 = "0.10"
# Configuration is files, and a file people hand-edit needs comments - which is the whole
# argument against reusing serde_json for it. Every refusal is worded by us rather than by
# the parser. `display` is here for the one thing Muster writes rather than reads: the window
# arrangement it saves, in the same format as the file beside it.
toml = { version = "1", default-features = false, features = ["display", "parse", "serde", "std"] }

# Lints live here rather than in a CI flag, so that `cargo build`, rust-analyzer and the
# gate all judge the code the same way. A rule only enforced by CI is a rule discovered
# after the work is done.
[workspace.lints.rust]
# Unsafe exists only where we touch C. Edition 2024 already requires the block; denying
# this keeps a whole `unsafe fn` from becoming one implicit unsafe region.
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Every unsafe block states why it is sound. The FFI boundary is where a wrong assumption
# is a crash rather than a failing test, so the reasoning belongs next to it.
undocumented_unsafe_blocks = "warn"

# Allowed, each for a reason rather than to quieten a run:
# The docs here are prose about why something exists, and they are full of proper nouns -
# libghostty, AppKit, herdr, macOS. Backticking every one costs readability and buys
# nothing.
doc_markdown = "allow"
# Modules are named for what they hold, so `input::KeyEvent` reads better than the
# shortened alternative this asks for.
module_name_repetitions = "allow"
# A required section produces prose nobody reads. What a function's failure *means* is
# already in its doc comment where it matters.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

# What a debug build costs per generation, measured on a clean build of this
# workspace: 1.6 GB before this block and 1.4 GB after, with the object files that
# carry the debug info halving from 0.23 GB to 0.11 GB. A modest lever, and it is
# on the quantity that multiplies - see the note below. Line tables keep what a
# backtrace is read for, a file and a line, and give up the variable inspection a
# debugger would want, which is a trade worth making on the profile nobody ships.
[profile.dev]
debug = 1

# Dependencies get none at all. Nobody steps through serde or prost, and symbol
# names come from the symbol table rather than from DWARF, so their frames still
# appear in a backtrace - without line numbers. `"*"` reaches dependencies only;
# workspace members keep what the block above gives them.
[profile.dev.package."*"]
debug = false

# Neither line above is the real answer. Cargo never garbage-collects a target
# directory, and that is what actually fills a disk here: a single build of this
# workspace writes 6,319 object files, and one checkout was measured holding
# 480,801 - the same build laid down some seventy-six times and never collected.
# No profile setting reaches that. `cargo clean gc` prunes by last use and is
# nightly-only, while this toolchain is pinned to stable on purpose, so cleaning
# periodically is the answer until it lands.
# https://github.com/rust-lang/cargo/issues/12633

# The perf harness measures this core, and a debug build describes a binary nobody runs.
# Line tables kept so a profile names functions instead of addresses.
[profile.release]
debug = "line-tables-only"
