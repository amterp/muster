kan_schema = "board/14"
id = "b_26BH4D7J4"
name = "main"
default_column = "backlog-lo"

[[columns]]
  name = "uncommitted"
  color = "#a1a1aa"
  description = "Ideas and open questions nobody has committed to: an agent's idea the owner has not taken up, or one of his own he has not decided to do. kan ready never lists this column, so no agent taking ready work sees these cards. Work the owner has asked for goes in a backlog column instead, even while decisions about it remain open. A card that waits on the owner's decision carries blocked. When one settles, the why lands in a commit message or a Fencil decision, and the card moves on or dies."
  limit = 0
  category = "idea"

[[columns]]
  name = "backlog-lo"
  color = "#6b7280"
  description = "Worth doing eventually. Nice-to-haves, speculative ideas, and anything that can wait until the core proves itself."
  limit = 0
  category = "open"

[[columns]]
  name = "backlog-hi"
  color = "#3b82f6"
  description = "Committed work on the path to a daily-drivable muster. Not scheduled yet, but not optional either."
  limit = 0
  category = "open"

[[columns]]
  name = "next"
  color = "#f59e0b"
  description = "Ready to pick up now: scoped, unblocked, and understood well enough to start without further design. Agents: when finishing work empties this column, refill it from the backlog by priority and natural sequencing."
  limit = 12
  category = "open"

[[columns]]
  name = "in-progress"
  color = "#10b981"
  description = "Actively being worked on, agents in parallel included. What matters is movement, not count: a card sitting here untouched is stalled work, not work in flight."
  limit = 24
  category = "active"

[[columns]]
  name = "review"
  color = "#ec4899"
  description = "Built and waiting for the owner's sign-off, including work a factory run built. The last comment says what was built and what to check. Agents put cards here and wait; the owner moves them to done."
  limit = 0
  category = "review"

[[columns]]
  name = "done"
  color = "#9333ea"
  description = "Finished and verified: code merged, tests green, docs updated where the change needed them."
  limit = 0
  category = "done"

[ready]
  exclude = ["labels=blocked"]

[custom_fields]
  [custom_fields.area]
    type = "enum-set"
    description = "Which part of muster the card touches"

    [[custom_fields.area.options]]
      value = "shell"
      color = "#8b5cf6"
      description = "The native app layer: windows, split UI, keymap, sidebar"

    [[custom_fields.area.options]]
      value = "renderer"
      color = "#06b6d4"
      description = "libghostty embedding and surface management"

    [[custom_fields.area.options]]
      value = "backend"
      color = "#f59e0b"
      description = "herdr protocol, the pane bridge, daemons, SSH transport"

    [[custom_fields.area.options]]
      value = "testing"
      color = "#22c55e"
      description = "Harness, fakes, corpora, snapshots, CI"

    [[custom_fields.area.options]]
      value = "devenv"
      color = "#64748b"
      description = "The Linux devenv container and local tooling"
  [custom_fields.labels]
    type = "enum-set"
    description = "Workflow flags that cut across areas"

    [[custom_fields.labels.options]]
      value = "ai-hi"
      color = "#22c55e"
      description = "Well-suited to autonomous AI work: scoped, mechanical, little judgment needed"

    [[custom_fields.labels.options]]
      value = "ai-lo"
      color = "#eab308"
      description = "Probably suitable for AI, but needs review of the judgment calls"

    [[custom_fields.labels.options]]
      value = "blocked"
      color = "#71717a"
      description = "Waiting on a decision or on another card"

    [[custom_fields.labels.options]]
      value = "kill-criterion"
      color = "#dc2626"
      description = "A stage-gate check from docs/origin.md: failing it questions the whole approach"
  [custom_fields.provenance]
    type = "enum"
    description = "Who raised this card and how far it has been vetted. An agent may write production code ONLY for 'approved' and 'agent-approved'. Agent-created cards start as 'ai-proposed'. The test for the bottom two values is narrow: did the owner state this want in their own words, or did an agent derive, decompose, or invent it?\n\nAGENTS.md, 'Repo conventions', says when an agent may promote a card: to 'agent-approved' under four tests, to 'approved' for work the owner asked to have built, and to 'approved' for a spike that spends nothing. Every other promotion is the owner's. When in doubt the card stays 'ai-proposed' with the needs-decision label."

    [[custom_fields.provenance.options]]
      value = "ai-proposed"
      color = "#94a3b8"
      description = "An agent raised this, or an agent decided its scope, and nobody has approved it as written. Refine and argue it; do not build it."

    [[custom_fields.provenance.options]]
      value = "human-raised"
      color = "#7dd3fc"
      description = "The owner asked for this in their own words. The premise is theirs, but scope and design may still be open."

    [[custom_fields.provenance.options]]
      value = "endorsed"
      color = "#fbbf24"
      description = "The owner agrees this should happen. Design questions remain."

    [[custom_fields.provenance.options]]
      value = "agent-approved"
      color = "#a3e635"
      description = "An agent approved it under the four tests in AGENTS.md: a defect fix, a follow-on from the owner's ask or unseen upkeep; overturns no owner decision; adds no public interface, persisted format or dependency; spends nothing and changes nothing outside the repo. Safe to implement without asking."

    [[custom_fields.provenance.options]]
      value = "approved"
      color = "#4ade80"
      description = "Concept and open decisions both settled. Safe for an agent to implement without asking."
  [custom_fields.tags]
    type = "free-set"
    description = "Ad-hoc markers, not project doctrine - unlike labels, anything goes here"
  [custom_fields.type]
    type = "enum"
    wanted = true
    description = "The kind of work this card represents"

    [[custom_fields.type.options]]
      value = "bug"
      color = "#dc2626"
      description = "A defect: wrong behavior, a crash, or a rendering/input infidelity"

    [[custom_fields.type.options]]
      value = "feature"
      color = "#16a34a"
      description = "New capability muster does not have yet"

    [[custom_fields.type.options]]
      value = "enhancement"
      color = "#2563eb"
      description = "An improvement to something that already works"

    [[custom_fields.type.options]]
      value = "docs"
      color = "#0891b2"
      description = "README, origin, design notes, or agent guidance"

    [[custom_fields.type.options]]
      value = "chore"
      color = "#4b5563"
      description = "Maintenance, tooling, measurement, or a decision to make"

[card_display]
  type_indicator = "type"
  badges = ["labels", "area", "tags"]

[[pattern_hooks]]
  name = "type-shortcut"
  pattern_title = "![a-zA-Z]+"
  command = ".kan/hooks/type-shortcut.rad"
  timeout = 0
