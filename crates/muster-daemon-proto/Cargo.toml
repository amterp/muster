[package]
name = "muster-daemon-proto"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
muster-frame.workspace = true
prost.workspace = true
serde = { workspace = true, optional = true }

[features]
# Serde for the messages a daemon writes into its persisted state. Only the daemon persists them,
# so only the daemon turns this on, and no client of the protocol carries serde for nothing.
serde = ["dep:serde"]

[build-dependencies]
prost-build = "0.14"
protox = "0.9"
sha2.workspace = true

[dev-dependencies]
prost-types = "0.14"
protox = "0.9"

[lints]
workspace = true
