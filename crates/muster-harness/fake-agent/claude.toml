# Detection manifest for the fake agent, installed as an override.
#
# muster-daemon reads overrides from $MUSTER_HOME/agent-detection/<agent>.toml. This one
# borrows claude's id, as the herdr probe's had to, and replaces the rules with markers a
# script can paint on demand - so the recorded detection scenario in corpus/herdr-0.8.0
# runs unchanged against the daemon.
#
# Safe because a test's daemon is a throwaway under a scratch home; it never sees a real
# claude session.

id = "claude"
version = "2026.10.21.1"
min_engine_version = 17

# What renames a session, as Claude Code's own manifest says it: the fake writes down every line
# it reads, so a test sees the rename typed.
# The fake agent's server, as Codex's manifest names its shared app-server: a copy of the fake run
# as `claude serve`, whose reports are refused whatever pane they name.
[server]
subcommand = "serve"
remedy = "run the fake agent without its server"

[session]
rename = "/rename {name}"
# What compacts a session, as Claude Code's own manifest says it, written down the same way.
compact = "/compact {focus}"
# Woken by its own finished jobs, as Claude Code's own manifest says it is.
wakes_when_jobs_end = true
# What starts the session again after a restart, as Claude Code's manifest spells it, but running
# this fake from where the harness installed it rather than a `claude` on the PATH.
resume = ["/bin/sh", "-c", "exec \"$HOME/.muster/bin/claude\" \"$@\"", "claude", "{args}", "--resume", "{session}"]
resume_drops = ["-p", "--print", "--resume"]
resume_values = ["--model", "--effort", "--resume"]
resume_keeps = ["--model", "--effort"]
# What wakes a session without typing into its pane, as Codex's manifest names `codex queue`. It
# runs only once a session id is reported: it writes down the id and the message and puts the
# agent to work, as Codex starts the queued turn. A session called "gone" refuses it, as a missing
# harness does, one called "dead" takes it and starts nothing, as `codex queue` does for a session
# whose Codex has exited, one called "slow" takes longer than the daemon waits for it, and one
# called "late" starts the turn 8 seconds later, as a Codex polling its queue does
# (docs/observations/codex-0.163.0.md).
wake = ["/bin/sh", "-c", "[ \"$0\" != gone ] || exit 3; [ \"$0\" != slow ] || { printf 'slow\\n' >> \"$HOME/fake-agent-woken\"; sleep 8; exit 0; }; printf '%s|%s\\n' \"$0\" \"$1\" >> \"$HOME/fake-agent-woken\"; pid=$(cat \"$HOME/fake-agent-pid\"); case \"$0\" in dead) ;; late) { sleep 8; kill -USR2 \"$pid\"; } </dev/null >/dev/null 2>&1 & ;; *) kill -USR2 \"$pid\" ;; esac", "{session}", "{message}"]

# At work, its prompt still takes a line, as Claude Code's box does: what an urgent ring reads.
[[rules]]
id = "probe_working"
state = "working"
priority = 1000
region = "whole_recent"
contains = ["probe-state:working"]
prompt = '^PROBE-PROMPT>\s?'
prompt_region = "bottom_non_empty_lines(3)"

[[rules]]
id = "probe_blocked"
state = "blocked"
priority = 990
region = "whole_recent"
contains = ["probe-state:blocked"]

[[rules]]
id = "probe_idle"
state = "idle"
priority = 980
region = "whole_recent"
contains = ["probe-state:idle"]

# The agent at its prompt, which the doorbell reads before typing: idle like probe_idle and
# above it, so the recorded scenario's states do not move.
[[rules]]
id = "probe_prompt"
state = "idle"
priority = 985
# Three lines, so a ring's text wrapped past the pane's width is read whole.
region = "bottom_non_empty_lines(3)"
line_regex = ['^PROBE-PROMPT>']
prompt = '^PROBE-PROMPT>\s?'

# What the agent at its prompt waits on, as Claude Code's done line counts the background shells
# still running: said of a screen another rule reads idle, never deciding the state itself.
[[rules]]
id = "probe_running"
state = "idle"
region = "whole_recent"
waiting = "its background shells"
contains = ["probe-running"]

# A menu opened from the prompt: a screen to wait out, as Claude Code's /mcp is.
[[rules]]
id = "probe_menu"
state = "unknown"
priority = 1100
region = "whole_recent"
skip_state_update = true
shows = "a menu opened from its prompt"
contains = ["probe-menu"]
