# Detection manifest for the fake agent, installed as an override.
#
# muster-daemon reads overrides from $MUSTER_HOME/agent-detection/<agent>.toml. This one
# borrows claude's id, as the herdr probe's had to, and replaces the rules with markers a
# script can paint on demand - so the recorded detection scenario in corpus/herdr-0.8.0
# runs unchanged against the daemon.
#
# Safe because a test's daemon is a throwaway under a scratch home; it never sees a real
# claude session.

id = "claude"
version = "2026.10.03.2"
min_engine_version = 8

# What renames a session, as Claude Code's own manifest says it: the fake writes down every line
# it reads, so a test sees the rename typed.
[session]
rename = "/rename {name}"

# At work, its prompt still takes a line, as Claude Code's box does: what an urgent ring reads.
[[rules]]
id = "probe_working"
state = "working"
priority = 1000
region = "whole_recent"
contains = ["probe-state:working"]
prompt = '^PROBE-PROMPT>\s?'
prompt_region = "bottom_non_empty_lines(3)"

[[rules]]
id = "probe_blocked"
state = "blocked"
priority = 990
region = "whole_recent"
contains = ["probe-state:blocked"]

[[rules]]
id = "probe_idle"
state = "idle"
priority = 980
region = "whole_recent"
contains = ["probe-state:idle"]

# The agent at its prompt, which the doorbell reads before typing: idle like probe_idle and
# above it, so the recorded scenario's states do not move.
[[rules]]
id = "probe_prompt"
state = "idle"
priority = 985
# Three lines, so a ring's text wrapped past the pane's width is read whole.
region = "bottom_non_empty_lines(3)"
line_regex = ['^PROBE-PROMPT>']
prompt = '^PROBE-PROMPT>\s?'

# A menu opened from the prompt: a screen to wait out, as Claude Code's /mcp is.
[[rules]]
id = "probe_menu"
state = "unknown"
priority = 1100
region = "whole_recent"
skip_state_update = true
contains = ["probe-menu"]
