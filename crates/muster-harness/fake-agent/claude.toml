# Detection manifest for the fake agent, installed as an override.
#
# muster-daemon reads overrides from $MUSTER_HOME/agent-detection/<agent>.toml. This one
# borrows claude's id, as the herdr probe's had to, and replaces the rules with markers a
# script can paint on demand - so the recorded detection scenario in corpus/herdr-0.8.0
# runs unchanged against the daemon.
#
# Safe because a test's daemon is a throwaway under a scratch home; it never sees a real
# claude session.

id = "claude"
version = "2026.08.11.1"
min_engine_version = 2

[[rules]]
id = "probe_working"
state = "working"
priority = 1000
region = "whole_recent"
contains = ["probe-state:working"]

[[rules]]
id = "probe_blocked"
state = "blocked"
priority = 990
region = "whole_recent"
contains = ["probe-state:blocked"]

[[rules]]
id = "probe_idle"
state = "idle"
priority = 980
region = "whole_recent"
contains = ["probe-state:idle"]
