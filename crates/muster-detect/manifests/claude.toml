id = "claude"
version = "2026.10.17.1"
min_engine_version = 16
updated_at = "2026-10-17T00:00:00Z"
aliases = ["claude-code"]

# Typed at an empty prompt with a Return, as a person names a session: what `/resume` lists and
# the prompt box's top rule shows (docs/observations/claude-code-2.1.288.md, section 5).
[session]
rename = "/rename {name}"
# Typed the same way, and what follows it is what the summary should keep
# (docs/observations/claude-code-2.1.289.md, section 1).
compact = "/compact {focus}"
# What a pane runs after a daemon restart to start its session again, with the arguments Claude
# Code was running with where {args} is (crates/muster-detect/src/resume.rs). From `claude --help`
# at 2.1.289: what starts, forks or leaves a session of its own is dropped, and every option
# that takes a value, `<x>` or `[x]`, is listed so its value is not read as a first prompt.
resume = ["claude", "{args}", "--resume", "{session}"]
resume_drops = [
  "-p", "--print", "-c", "--continue", "-r", "--resume", "--session-id", "--fork-session",
  "--from-pr", "--teleport", "--cloud", "--environment", "--bg", "--background", "--desktop",
  "-w", "--worktree", "--tmux", "-h", "--help", "-v", "--version",
]
resume_values = [
  "--add-dir", "--agent", "--agents", "--allowedTools", "--allowed-tools",
  "--append-system-prompt", "--autocompact", "--betas", "--cloud", "-d", "--debug",
  "--debug-file", "--disallowedTools", "--disallowed-tools", "--effort", "--environment",
  "--fallback-model", "--file", "--from-pr", "--input-format", "--json-schema",
  "--max-budget-usd", "--mcp-config", "--model", "-n", "--name", "--output-format",
  "--permission-mode", "--permission-prompts", "--plugin-dir", "--plugin-url",
  "--prompt-suggestions", "--remote-control", "--remote-control-session-name-prefix", "-r",
  "--resume", "--session-id", "--setting-sources", "--settings", "--system-prompt",
  "--system-prompt-snapshot", "--teleport", "--tools", "-w", "--worktree",
]
# Carried even when a word in the arguments could be a prompt and the rest are not: a session
# resumed on the settings default instead of its own model and effort is not the same session.
resume_keeps = ["--model", "--effort"]

[[rules]]
id = "osc_title_working"
state = "working"
priority = 1100
region = "osc_title"
visible_working = true
# Braille covers <= 2.1.227; half-circles are the 2.1.228 busy spinner.
regex = ['^[\x{2800}-\x{28FF}\x{25D0}-\x{25D3}] ']

[[rules]]
id = "live_turn_working"
state = "working"
priority = 970
region = "bottom_non_empty_lines(12)"
visible_working = true
any = [
  { line_regex = ['^\s*[⏸⏵].*esc to interrupt(?:\s|·|$)'] },
  # A spinner with no timer yet says only words. Claude Code 2.1.299 draws each finished Bash
  # call as `· $ <command>…`, cut to the pane's width, which is not words and not a spinner
  # (docs/observations/claude-code-2.1.299.md, section 1).
  { line_regex = ['^\s*[\x{002A}\x{00B7}\x{2722}\x{2733}\x{2736}\x{273B}\x{273D}]\s+(?:\S.*…\s+\(\d+[smh](?:\s|·)|\p{L}[\w ,’-]*…\s*$)'] },
]
# What is typed into the prompt box while Claude works is queued and taken into the running
# turn, so an urgent message may be typed here. Read in the box alone: the request that started
# the turn is drawn above it with the same caret.
prompt = '^\s*❯\s?'
prompt_region = "prompt_box_body"

[[rules]]
id = "background_agents_working"
state = "working"
priority = 965
region = "last_non_empty_above_prompt_box"
visible_working = true
line_regex = ['^\s*[\x{002A}\x{00B7}\x{2722}\x{2736}\x{273B}\x{273D}]\s+Waiting for [1-9]\d* background agents? to finish\s*$']

[[rules]]
id = "background_mcp_task_working"
state = "working"
priority = 965
region = "bottom_non_empty_lines(12)"
visible_working = true
# Claude renders activity summaries at column zero; wrapped continuations are indented.
# Keeping that shape prevents user prompt text from impersonating this signal.
regex = ['(?m)^[\x{002A}\x{00B7}\x{2722}\x{2736}\x{273B}\x{273D}][ \t]+\S[^\n]*?(?:\n[ \t]+[^\n]*?){0,3}·(?:[ \t]+|\n[ \t]*)[1-9]\d*(?:[ \t]+|\n[ \t]*)MCP(?:[ \t]+|\n[ \t]*)tasks?(?:[ \t]+|\n[ \t]*)still(?:[ \t]+|\n[ \t]*)running[ \t]*$']
not = [
  { contains = ["do you want to proceed?"] },
  { contains = ["esc to cancel"] },
  { contains = ["waiting for permission"] },
  { contains = ["do you want to allow this connection?"] },
  { contains = ["tab to amend"] },
  { contains = ["ctrl+e to explain"] },
]

[[rules]]
id = "btw_overlay_working"
state = "working"
priority = 975
region = "bottom_non_empty_lines(5)"
visible_working = true
line_regex = [
  '^\s*/btw(?:\s|$)',
  '(?i)esc to close\s*$',
]

[[rules]]
id = "transcript_viewer"
state = "unknown"
priority = 1000
region = "bottom_non_empty_lines(3)"
skip_state_update = true
shows = "its transcript viewer"
contains = ["showing detailed transcript"]
any = [
  { contains = ["ctrl+o", "to toggle"] },
  { contains = ["ctrl+e", "show all"] },
  { contains = ["ctrl+e", "collapse"] },
  { contains = ["↑↓ scroll"] },
  { contains = ["? for shortcuts"] },
]

[[rules]]
id = "own_menu"
state = "unknown"
# Menus someone opens from the prompt end in a live dialog's footer, and nobody is waiting on
# anybody: above live_blocked_form, so the state stays what it was. Keyed on each menu's title,
# the first line below the last horizontal rule.
priority = 1160
region = "after_last_horizontal_rule"
skip_state_update = true
shows = "a menu opened from its prompt"
contains = ["esc to cancel"]
# /hooks' own submenus too: an event's matchers ("PreToolUse - Matchers"), and a matcher's
# hooks ("PreToolUse - Matcher: Bash").
regex = ['(?im)\A\s*(hooks|manage mcp servers|memory|\w+ - matchers|\w+ - matcher: .*)[ \t]*$']

[[rules]]
id = "live_blocked_form"
state = "blocked"
# Above every working rule, the title's included: a dialog open below the last horizontal rule
# is waiting on you, whatever else on screen still animates (sub-agents running beside it).
# It also outranks a working hook report from one of those sub-agents: at once when the report
# came after the dialog drew, and after two seconds when it came before.
# The region is what keeps stale text out: once the dialog closes, below the last rule is the
# status footer again.
priority = 1150
region = "after_last_horizontal_rule"
visible_blocker = true
contains = ["esc to cancel"]
any = [
  { contains = ["enter to confirm"] },
  { contains = ["enter to select"], any = [
    { contains = ["tab/arrow keys to navigate"] },
    { contains = ["arrow keys to navigate"] },
    { contains = ["arrows to navigate"] },
    { contains = ["↑/↓ to navigate"] },
    { contains = ["↑↓ to navigate"] },
  ] },
]

[[rules]]
id = "dynamic_workflow_prompt"
state = "blocked"
priority = 980
region = "whole_recent"
visible_blocker = true
contains = ["run a dynamic workflow?", "esc to cancel"]

[[rules]]
id = "mcp_elicitation_prompt"
state = "blocked"
priority = 980
region = "whole_recent"
visible_blocker = true
# MCP elicitation dialogs (elicitation/create) show Accept/Decline controls
# with an "Esc to cancel" footer but no Enter hint, so live_blocked_form
# cannot see them (issue #3283). Gate on the invariant header line, the
# Accept/Decline control line, and the cancel footer.
contains = ["esc to cancel"]
line_regex = ['(?i)^\s*MCP server ["\x{201C}].+["\x{201D}] requests your input\s*$']
all = [
  { any = [
    { line_regex = ['^\s*\x{276F}?\s*Accept\b'] },
    { line_regex = ['^\s*\x{276F}?\s*Decline\b'] },
  ] },
]

# A fresh install asks for a theme, shows security notes and, with no API key, asks how to log
# in, before any session starts. None has a footer live_blocked_form reads, and nothing on screen
# says idle, so without these they read idle by no rule. Above every working rule, for
# live_blocked_form's reason. Words are matched across lines, since each wraps in a narrow pane
# (docs/observations/claude-code-2.1.299.md, section 2).
#
# Being above the working rules, each is kept to the screen it names: none of the three draws a
# horizontal rule, and a session always does, as the top of its prompt box. So the same words
# quoted in a session's output - this repository's own recordings of these screens, say - leave
# the session's state alone. The transcript viewer is kept out by its footer.
[[rules]]
id = "first_run_theme"
state = "blocked"
priority = 1150
region = "bottom_non_empty_lines(30)"
visible_blocker = true
# Read by its words, not its options: /theme opened from the prompt offers the same ones.
regex = ['(?i)choose\s+the\s+text\s+style', '(?i)to\s+change\s+this\s+later,\s+run\s+/theme']
not = [
  { regex = ['(?m)^\s*─{3}'] },
  { contains = ["showing detailed transcript"] },
]

[[rules]]
id = "first_run_security_notes"
state = "blocked"
priority = 1150
region = "bottom_non_empty_lines(20)"
visible_blocker = true
contains = ["security notes:"]
regex = ['(?i)press\s+enter\s+to\s+continue']
not = [
  { regex = ['(?m)^\s*─{3}'] },
  { contains = ["showing detailed transcript"] },
]

# /login opened from the prompt draws the login picker under a title and an Esc footer, in a
# session nobody is waiting on: above login_method, so the state stays what it was. Its top
# border is a row of ▔ rather than a horizontal rule, so own_menu's region does not find it
# (corpus/claude-code-2.1.299/startup-dialogs.txt).
[[rules]]
id = "login_menu"
state = "unknown"
priority = 1160
region = "bottom_non_empty_lines(20)"
skip_state_update = true
shows = "its /login menu"
contains = ["select login method:", "esc to cancel"]

# Once Claude Code's feedback tool drafts a bug report, 2.1.302 leaves a box above the prompt
# until somebody answers it, and the box takes digits: "1 to review · 2 to send · 0 to dismiss".
# A ring typed there could send a report nobody approved, and a ring's text holds digits, so it
# is a screen to wait out, above every working rule. Read by the box's last row and its foot, at
# the left edge where Claude Code draws it, so the same box quoted in a turn's output, indented,
# leaves the session's state alone (corpus/claude-code-2.1.302/feedback-draft.txt).
[[rules]]
id = "feedback_draft_box"
state = "unknown"
priority = 1160
region = "bottom_non_empty_lines(8)"
skip_state_update = true
shows = "Claude Code's box for a bug report it drafted (1 to review, 2 to send, 0 to dismiss)"
regex = ['(?m)^│ ?1 to review · 2 to send · 0 to dismiss *│\n╰─+╯$']

[[rules]]
id = "login_method"
state = "blocked"
priority = 1150
region = "bottom_non_empty_lines(20)"
visible_blocker = true
contains = ["select login method:"]
regex = ['(?i)claude\s+account\s+with\s+subscription', '(?i)anthropic\s+console\s+account']
not = [
  { regex = ['(?m)^\s*─{3}'] },
  { contains = ["showing detailed transcript"] },
]

[[rules]]
id = "live_prompt_box"
state = "idle"
priority = 950
region = "prompt_box_body"
visible_idle = true
line_regex = ['^\s*❯']
# What follows the caret is the prompt's text; 2.1.283 puts a no-break space after it.
prompt = '^\s*❯\s?'
not = [
  { contains = ["enter to select"] },
  { contains = ["esc to cancel"] },
  { contains = ["tab/arrow keys"] },
  { contains = ["arrow keys to navigate"] },
  { contains = ["↑/↓ to navigate"] },
]

# A turn that ended with work of its own still running says so at the end of its done line,
# `✻ Crunched for 2m 23s · done 9:04 pm · 2 shells, 1 monitor still running`, and a background
# shell that ends starts the next turn: the agent is waiting on it, not on you. A monitor alone
# is not counted, since it watches for something that may never happen. Read as the last thing
# above the prompt box, its words matched across lines for a narrow pane, so the footer's
# `· 1 shell` below the box, there at work too, says nothing. It names the wait of a screen
# another rule reads idle and decides no state (corpus/claude-code-2.1.302/). The line stays for
# as long as a shell lives, so a dev server would read waiting for good: a wait read off the
# screen lasts 10 minutes at most, and the pane then reads idle, its turn finished.
[[rules]]
id = "background_shells_waiting"
state = "idle"
region = "above_prompt_box"
waiting = "its background shells"
regex = ['(?m)^[\x{002A}\x{00B7}\x{2722}\x{2733}\x{2736}\x{273B}\x{273D}][ \t]+\S[^\n]*?(?:\n[ \t]+[^\n]*?){0,3}·(?:[ \t]+|\n[ \t]*)(?:[1-9]\d*(?:[ \t]+|\n[ \t]*)\w+,(?:[ \t]+|\n[ \t]*))*[1-9]\d*(?:[ \t]+|\n[ \t]*)shells?(?:,(?:[ \t]+|\n[ \t]*)[1-9]\d*(?:[ \t]+|\n[ \t]*)\w+)*(?:[ \t]+|\n[ \t]*)still(?:[ \t]+|\n[ \t]*)running\s*\z']

[[rules]]
id = "model_picker_menu"
state = "unknown"
priority = 900
region = "whole_recent"
skip_state_update = true
shows = "its /model menu"
contains = ["select model", "enter to set as default", "esc to cancel"]
not = [
  { contains = ["do you want to proceed?"] },
  { contains = ["enter to select"] },
]

[[rules]]
id = "bash_permission_prompt"
state = "blocked"
priority = 850
region = "whole_recent"
visible_blocker = true
contains = ["do you want to proceed?"]
any = [
  { contains = ["bash command"] },
  { contains = ["bash("] },
  { contains = ["contains expansion"] },
  { contains = ["tab to amend"] },
  { contains = ["ctrl+e to explain"] },
]
# Claude marks the selected option with "❯", so every option branch has to allow
# that prefix. Numbered branches that omit it only match options the cursor has
# moved away from, which left the resting layout below unmatched here (#2650):
#   ❯ 1. Yes / 2. Yes, and don't ask again for: <cmd> / 3. No
# Cover both the two-option and "don't ask again" three-option shapes so this
# rule, not the narrower generic_permission_prompt, claims Bash approvals.
all = [
  { any = [
    { line_regex = ['(?i)^\s*❯?\s*yes\b'] },
    { line_regex = ['(?i)^\s*❯?\s*1\.\s*yes\b'] },
    { line_regex = ['(?i)^\s*❯?\s*2\.\s*yes\b'] },
    { line_regex = ['(?i)^\s*❯?\s*2\.\s*no\b'] },
    { line_regex = ['(?i)^\s*❯?\s*3\.\s*no\b'] },
  ] },
]

[[rules]]
id = "generic_permission_prompt"
state = "blocked"
# Above every working rule, for live_blocked_form's reason. bash_permission_prompt stays below
# them, because it reads the whole recent screen.
priority = 1150
region = "after_last_horizontal_rule"
visible_blocker = true
contains = ["do you want to proceed?", "esc to cancel"]
all = [
  { any = [
    { line_regex = ['(?i)^\s*❯?\s*1\.\s*yes\b'] },
    { line_regex = ['(?i)^\s*2\.\s*yes\b'] },
    { line_regex = ['(?i)^\s*2\.\s*no\b'] },
    { line_regex = ['(?i)^\s*3\.\s*no\b'] },
  ] },
]

[[rules]]
id = "plan_approval_prompt"
state = "blocked"
# Plan mode's ExitPlanMode dialog, which asks with "would you like" where a permission prompt asks
# "do you want". Above every working rule, for live_blocked_form's reason. Its question wraps in a
# pane narrower than itself, so the words are matched across lines: wrapped, nothing else on
# screen said blocked, and the idle title decided.
priority = 1150
region = "after_last_horizontal_rule"
visible_blocker = true
regex = ['(?i)would\s+you\s+like\s+to\s+proceed\?']
line_regex = ['(?i)^\s*❯?\s*1\.\s*yes\b']

[[rules]]
id = "legacy_no_prompt_blocker"
state = "blocked"
priority = 300
region = "whole_recent"
any = [
  { contains = ["do you want to"], any = [{ contains = ["yes"] }, { contains = ["❯"] }] },
  { contains = ["would you like to"], any = [{ contains = ["yes"] }, { contains = ["❯"] }] },
  { contains = ["waiting for permission"] },
  { contains = ["do you want to allow this connection?"] },
  { contains = ["tab to amend"] },
  { contains = ["ctrl+e to explain"] },
  { contains = ["do you want to proceed?", "esc to cancel"] },
  { contains = ["review your answers"] },
  { contains = ["skip interview and plan immediately"] },
]
not = [
  { regex = ['(?m)^\s*❯\s*$'] },
]

[[rules]]
id = "osc_title_idle"
state = "idle"
priority = 250
region = "osc_title"
visible_idle = true
regex = ['^\x{2733} ']

[[rules]]
id = "osc_progress_idle"
state = "idle"
priority = 250
region = "osc_progress"
regex = ['^4;0']
