# Changed by Muster from herdr's catalog: `script_paths` names pi's npm package, which herdr
# recognised in code, and so the manifest needs engine 4, the first to read that field.
id = "pi"
version = "2026.09.14.1"
min_engine_version = 4
updated_at = "2026-09-14T00:00:00Z"
aliases = ["herdr:pi"]
script_paths = ["node_modules/@earendil-works/pi-coding-agent/dist/cli"]

[[rules]]
id = "working_literal"
state = "working"
priority = 100
region = "whole_recent"
visible_working = true
contains = ["Working..."]

[[rules]]
id = "working_border"
state = "working"
priority = 100
region = "bottom_non_empty_lines(12)"
visible_working = true
line_regex = ['^── [⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏] Working ─+$']
