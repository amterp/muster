# Changed by Muster from herdr v0.8.0: the alias `opencode2`, a name herdr's code knew the
# agent by, since Muster identifies an agent only by the names its manifest gives; and
# `prompt_box`, reading OpenCode's prompt for the doorbell.
id = "opencode"
version = "2026.11.11.1"
min_engine_version = 15
updated_at = "2026-11-11T00:00:00Z"
aliases = ["open-code", "opencode2", "herdr:opencode"]

[session]
# No compact: `/compact` and its Return in one write leave the command in the box, its Return taken
# by the list of commands, and words after it go to the model as a message
# (docs/observations/opencode-1.19.5.md, section 1).
# What a pane runs after a daemon restart, or a restart of the agent, to start its session again:
# `--session` takes the id, and the session runs with the options given beside it
# (docs/observations/opencode-1.19.5.md, section 2). From `opencode --help` at 1.19.5: what picks
# or forks another session or sends a first prompt is dropped, and every option that takes a
# value is listed. A path to start in is the one word OpenCode takes on its own, and is dropped
# as a prompt would be; the pane starts in its own directory.
resume = ["opencode", "{args}", "--session", "{session}"]
resume_drops = [
  "-c", "--continue", "-s", "--session", "--fork", "--prompt", "-h", "--help", "-v", "--version",
]
resume_values = [
  "-m", "--model", "-s", "--session", "--prompt", "--agent", "--port", "--hostname",
  "--log-level", "--mdns-domain", "--cors", "--replay-limit",
]
# The model and the agent it ran as.
resume_keeps = ["-m", "--model", "--agent"]

[[rules]]
id = "permission_required"
state = "blocked"
priority = 300
region = "whole_recent"
visible_blocker = true
any = [
  { contains = ["△ Permission required"] },
  { contains = ["esc dismiss"], any = [{ contains = ["enter confirm"] }, { contains = ["enter submit"] }, { contains = ["enter toggle"] }], all = [{ any = [{ contains = ["↑↓ select"] }, { contains = ["⇆ tab"] }] }] },
]

[[rules]]
id = "interrupt_hint_working"
state = "working"
priority = 110
region = "whole_recent"
visible_working = true
any = [
  { contains = ["esc to interrupt"] },
  { contains = ["ctrl+c to interrupt"] },
  { contains = ["press esc to interrupt"] },
  { line_regex = ['(?i).*opencode.*esc (again to )?interrupt'] },
]

[[rules]]
id = "progress_bar_working"
state = "working"
priority = 100
region = "whole_recent"
visible_working = true
regex = ['(■|⬝){4,}']

# A picker opened from the prompt box - the command palette, the session list - titled on its
# first line with `esc` at the right and a search line below. Nobody is waiting on anybody, and a
# ring typed now would land in its search, though the box may still show behind it: above
# prompt_box and below every working rule, so the state stays what it was.
[[rules]]
id = "picker"
state = "unknown"
priority = 60
region = "whole_recent"
skip_state_update = true
all = [{ line_regex = ['\S\s{8,}esc$'] }, { line_regex = ['^\s*Search$'] }]

# OpenCode at its prompt box, which the doorbell reads before typing: the box with a bar down its
# left side, above its foot, without the line naming the agent and model. Each of the box's lines
# starts with the bar, and an empty box holds a suggestion drawn in grey rather than faint
# (docs/observations/opencode-1.18.34.md). Below every working rule, since a working screen
# shows the box too; not a visible idle.
[[rules]]
id = "prompt_box"
state = "idle"
priority = 50
region = "bar_prompt"
line_regex = ['^\s*┃']
prompt = '^\s*┃'
prompt_margin = '^\s*┃'
prompt_placeholder = '^Ask anything… ".*"$'
