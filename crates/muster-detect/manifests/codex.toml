id = "codex"
version = "2026.11.13.3"
min_engine_version = 20
updated_at = "2026-11-13T00:00:00Z"

# Stop runs before Codex accepts commands again; its working spinner covers the remaining hooks.
defer_idle_while_working = true

# Codex runs its own binary under these names for work that is not a session, which its 0.154.0
# binary carries as strings. On Linux each command the model runs goes through
# codex-linux-sandbox, in a process group of its own, and would read as a nested Codex
# reporting into the pane.
helpers = ["codex-linux-sandbox", "codex-execve-wrapper", "codex-code-mode-host"]

# Codex 0.160.0 runs every session's commands and hooks in one app-server, `codex app-server
# --listen unix:// --managed-daemon`, which the first session starts and later ones join, so they
# all carry the first session's environment, `MUSTER_PANE` included. Nothing below it can say which
# pane it is from (docs/observations/codex-0.160.0.md, section 1).
[server]
subcommand = "app-server"
remedy = """run `codex features disable daemon_auto_start` and `codex app-server daemon stop`, \
then restart Codex, so that each session runs its own commands and hooks; or start Codex as \
`codex --no-daemon`"""

# Typed at an empty composer with a Return; Codex takes the name inline, before its first turn
# as well as after (docs/observations/codex-0.154.0.md, section 5).
[session]
image_paste = true
rename = "/rename {name}"
# Typed at an empty composer with a Return, it compacts at once; words after it are not a focus
# but a message to the model (docs/observations/codex-0.167.0.md, section 3).
compact = "/compact"
# Typed at an empty composer with a Return, it clears the conversation once Codex accepts commands
# (docs/observations/codex-0.167.2.md, section 2). Not `/new`, which in a Git repository first asks
# where the new conversation runs (docs/observations/codex-0.167.0.md, section 1). The new
# session's id is reported only at its first prompt (docs/observations/codex-0.166.0.md).
clear = "/clear"
# /new leaves the old conversation loaded and its id reported until the first new prompt.
# A queued wake can reach that old conversation or survive a read and replay on resume.
# Typing reaches the visible composer instead (docs/observations/codex-0.166.0.md).
# What a pane runs after a daemon restart, or a restart of the agent, to start its session again.
# `codex resume` takes the options `codex` does, before the id, and runs with them rather than
# with the ones the session was started with (docs/observations/codex-0.167.0.md, section 4).
# From `codex resume --help` at 0.167.0: what picks another session, attaches images to a first
# prompt or makes a worktree is dropped, and every option that takes a value is listed.
resume = ["codex", "resume", "{args}", "{session}"]
resume_drops = [
  "--last", "--all", "--include-non-interactive", "-i", "--image", "--worktree", "-h", "--help",
  "-V", "--version",
]
resume_values = [
  "-c", "--config", "--enable", "--disable", "--remote", "--remote-auth-token-env", "-i",
  "--image", "-m", "--model", "--local-provider", "-p", "--profile", "-s", "--sandbox", "-C",
  "--cd", "--add-dir", "-a", "--ask-for-approval",
]
# The model, its settings and what the session may do without asking.
resume_keeps = [
  "-m", "--model", "-c", "--config", "-p", "--profile", "-s", "--sandbox", "-a",
  "--ask-for-approval",
]

[[rules]]
id = "osc_title_blocked"
state = "blocked"
priority = 1100
region = "osc_title"
visible_blocker = true
contains = ["Action Required"]

[[rules]]
id = "osc_title_working"
state = "working"
priority = 1050
region = "osc_title"
visible_working = true
regex = ['(?:^| )[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏](?: |$)']

[[rules]]
id = "transcript_viewer"
state = "unknown"
priority = 1000
region = "after_last_prompt_marker"
skip_state_update = true
contains = ["↑/↓ to scroll", "pgup/pgdn to", "home/end to jump", "q to quit"]
any = [
  { contains = ["esc to edit prev"] },
  { contains = ["esc/← to edit prev"] },
]

[[rules]]
id = "trust_directory"
state = "blocked"
priority = 950
region = "top_non_empty_lines(20)"
visible_blocker = true
all = [
  { regex = ['\A> You are in [^\r\n]+(?:\r?\n|$)'] },
  { regex = ['(?s)Do\s+you\s+trust\s+the\s+contents\s+of\s+this\s+directory\?'] },
]

# Codex's dialogs before a session starts mark the chosen option with the composer's caret,
# `› 1. ...`, which live_prompt would read as the composer holding a draft. Each is read by the
# options it offers. The update dialog's two outlast a change of its title and footer between
# 0.154.0 and 0.160.0, and the banner left above the composer once it is skipped holds neither
# (docs/observations/codex-0.160.0.md, section 3).
[[rules]]
id = "startup_update"
state = "blocked"
priority = 950
region = "bottom_non_empty_lines(20)"
visible_blocker = true
contains = ["Update now", "Skip until next version"]

[[rules]]
id = "model_migration"
state = "blocked"
priority = 950
region = "bottom_non_empty_lines(20)"
visible_blocker = true
regex = [
  '(?m)^[ \t]*(?:[›>][ \t]+)?1\.[ \t]+Try new model[ \t]*$',
  '(?m)^[ \t]*(?:[›>][ \t]+)?2\.[ \t]+Use existing model[ \t]*$',
]

# 0.160.0's folder trust dialog, which replaced trust_directory's question.
[[rules]]
id = "trust_folder"
state = "blocked"
priority = 950
region = "bottom_non_empty_lines(20)"
visible_blocker = true
contains = ["Trust this folder?", "Trust and continue"]

# Hooks it has not seen, which it asks about before it takes a prompt.
[[rules]]
id = "hooks_review"
state = "blocked"
priority = 950
region = "bottom_non_empty_lines(20)"
visible_blocker = true
contains = ["Hooks need review", "Trust all and continue"]

# No login and no other provider: nothing runs until somebody signs in.
[[rules]]
id = "sign_in"
state = "blocked"
priority = 950
region = "bottom_non_empty_lines(20)"
visible_blocker = true
contains = ["Sign in with ChatGPT", "Provide your own API key"]

# Pickers a person opens from the composer draw selection_dialog's footer too, and wait on nobody
# but whoever opened them (corpus/codex-0.167.0/pickers.txt).
[[rules]]
id = "model_picker"
state = "unknown"
priority = 960
region = "bottom_non_empty_lines(20)"
skip_state_update = true
shows = "its /model picker"
contains = ["Select Model and Effort", "esc back"]

[[rules]]
id = "permissions_picker"
state = "unknown"
priority = 960
region = "bottom_non_empty_lines(20)"
skip_state_update = true
shows = "its /permissions picker"
contains = ["Update Model Permissions", "esc back"]

# Every list Codex asks a question with ends on a footer of two key hints, Return's and Esc's:
# `enter select · esc back` under /new's question of where the new conversation runs, `enter
# continue · esc quit` under the folder trust dialog. Each marks its chosen option with the
# composer's caret, which live_prompt would read as a draft, so the footer is what tells them apart.
[[rules]]
id = "selection_dialog"
state = "blocked"
priority = 950
region = "bottom_non_empty_lines(3)"
visible_blocker = true
line_regex = ['^\s*enter [a-z]+ · esc [a-z]+\s*$']

[[rules]]
id = "live_strong_blocker"
state = "blocked"
priority = 900
region = "after_last_prompt_marker"
visible_blocker = true
any = [
  { contains = ["press enter to confirm or esc to cancel"] },
  { contains = ["enter to submit answer"] },
  { contains = ["enter to submit all"] },
  { contains = ["allow command?"] },
  { contains = ["All Results", "Filesystem Only", "Plugins"] },
]

[[rules]]
id = "weak_blocker"
state = "blocked"
priority = 600
region = "whole_recent_without_current_prompt_marker"
# Sparkles can replace the space after ›. A later response marker makes that prompt stale.
not = [{ regex = ['(?m)^›[⠁⠂⠄⠈⠐⠠⡀⢀][^\n]*(?:\n(?:[^•■✗✓\n][^\n]*)?)*\z'] }]
any = [
  { contains = ["[y/n]"] },
  { contains = ["yes (y)"] },
  { contains = ["do you want to"], any = [{ contains = ["yes"] }, { contains = ["❯"] }] },
  { contains = ["would you like to"], any = [{ contains = ["yes"] }, { contains = ["❯"] }] },
]

[[rules]]
id = "screen_working_fallback"
state = "working"
priority = 500
region = "before_current_prompt_marker"
visible_working = true
# Support animated and reduced-motion status, including dynamic activity labels.
# The interrupt hint can be remapped, unbound, or hidden, and queued inputs can
# sit below the status. Require the live timer suffix with no later response.
any = [{ contains = [" to interrupt)"] }, { contains = ["s)"] }]
regex = ['(?m)^(?:[•◦][ \t]+)?[^\s›•◦■✗✓─][^\r\n]* \((?:[0-9]+[hm] )*[0-9]+s(?: • [^\r\n]+? to interrupt)?\)(?: · [^\r\n]*)?(?:\r?\n(?:[^•◦›■✗✓─\r\n][^\r\n]*|•[ \t]+(?:Queued\s+follow-up\s+inputs|Messages\s+to\s+be\s+submitted\s+after\s+next\s+tool\s+call(?:\s+\(press\s+[^\r\n]+?\s+to\s+interrupt\s+and\s+send\s+immediately\))?|Messages\s+to\s+be\s+submitted\s+at\s+end\s+of\s+turn)|›[⠁⠂⠄⠈⠐⠠⡀⢀][^\r\n]*)?)*\s*\z']
# A failed reconnect keeps its final elapsed timer but is no longer working.
not = [{ line_regex = ['^(?:[•◦][ \t]+)?Reconnect failed — check the endpoint, then relaunch \([0-9hms ]+\)$'] }]
# Codex's composer stays under its working line and takes what is typed; Return holds the line
# "to be submitted after next tool call" and empties the composer (docs/observations/
# codex-0.154.0.md, section 6). An urgent ring is typed here, read in the composer alone.
prompt = '^›\s?'
prompt_region = "current_prompt"

# Codex at its composer, which the doorbell reads before typing: the composer alone, down to the
# blank line above its footer, since earlier requests are drawn above it with the same caret and
# the footer below would read as typed. Below screen_working_fallback, because a working screen
# shows the composer too. Not a visible idle: whatever else is on screen decides first.
[[rules]]
id = "live_prompt"
state = "idle"
priority = 400
region = "current_prompt"
line_regex = ['^›(?: |$)']
prompt = '^›\s?'
