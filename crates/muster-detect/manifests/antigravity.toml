id = "agy"
version = "2026.11.21.2"
min_engine_version = 21
updated_at = "2026-11-21T00:00:00Z"
aliases = ["antigravity", "antigravity-cli"]

defer_idle_while_working = true

[[rows]]
id = "last_content"
regex = '\S'

[[rows]]
id = "last_rule"
regex = '^─{12,}$'
start = { row = "last_content", offset = -5 }

[[rows]]
id = "composer_prompt"
regex = '^>(?:\s|$)'
end = { row = "last_rule" }

[[rows]]
id = "composer_top"
regex = '^─{12,}$'
start = { row = "composer_prompt", offset = -1 }
end = { row = "composer_prompt" }

# A running task adds another rule below the composer. The first rule after the prompt
# still ends the input; the last one can belong to the task panel.
[[rows]]
id = "composer_bottom"
regex = '^─{12,}$'
take = "first"
start = { row = "composer_prompt", offset = 1 }
end = { row = "last_rule", offset = 1 }

[regions.composer]
start = { row = "composer_top", offset = 1 }
end = { row = "composer_bottom" }

[regions.task_footer]
start = { row = "composer_bottom", offset = 1 }

[session]
rename = "/rename {name}"
clear = "/clear"
compact = "/compact {focus}"
resume = ["agy", "{args}", "--conversation", "{session}"]
resume_drops = [
  "-c", "--continue", "--conversation", "-i", "--prompt-interactive", "-p", "--print", "--prompt",
  "--disable-slash-commands", "--input-format", "--output-format", "--json-schema", "--print-timeout",
  "--log-file", "--project", "--new-project", "--remote-agent", "--remote-control",
  "--dangerously-skip-permissions", "-h", "--help", "--version",
]
resume_values = [
  "--conversation", "-i", "--prompt-interactive", "-p", "--print", "--prompt", "--input-format",
  "--output-format", "--json-schema", "--print-timeout", "--log-file", "--project", "--add-dir",
  "--agent", "--effort", "--mode", "--model", "--settings",
]
resume_keeps = ["--add-dir", "--agent", "--effort", "--mode", "--model", "--settings"]
resume_files = ["--settings"]

[[rules]]
id = "trust_project"
state = "blocked"
priority = 310
region = "bottom_non_empty_lines(15)"
visible_blocker = true
contains = ["yes, i trust this folder", "no, exit", "navigate · enter confirm"]

[[rules]]
id = "permission_prompt"
state = "blocked"
priority = 300
region = "bottom_non_empty_lines(18)"
visible_blocker = true
contains = ["requesting permission for:"]
any = [
  { contains = ["do you want to proceed?"] },
  { contains = ["tab amend", "edit command"] },
  { contains = ["run this command?", "no, cancel", "tab amend"] },
  { contains = ["run this command?", "no, cancel", "navigate"] },
]

[[rules]]
id = "spinner_working"
state = "working"
priority = 100
region = "bottom_non_empty_lines(12)"
visible_working = true
line_regex = ['^\s*[\u2800-\u28FF]+\s+\p{Alphabetic}+\w*ing\b', '^esc to cancel(?:\s|$)']

[[rules]]
id = "slash_menu"
state = "unknown"
priority = 180
region = "bottom_non_empty_lines(12)"
skip_state_update = true
contains = ["navigate · enter select · tab complete"]

[[rules]]
id = "composer"
state = "idle"
priority = 50
region = "composer"
line_regex = ['^>(?:\s|$)']
prompt = '^> ?'
prompt_placeholder = '^Auto mode: edits & safe commands auto-approved \(shift\+(?:tab to cycle\)|\.\.\.)$'

[[rules]]
id = "background_tasks_waiting"
state = "idle"
region = "task_footer"
waiting = "its background tasks"
line_regex = ['\b[1-9][0-9]*\s+task\(s\)\s+·\s+/tasks\s*$']
