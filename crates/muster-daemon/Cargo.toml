[package]
name = "muster-daemon"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "muster-daemon"
path = "src/main.rs"

[dependencies]
libc.workspace = true
muster-core.workspace = true
muster-daemon-proto = { workspace = true, features = ["serde"] }
muster-detect.workspace = true
muster-msg.workspace = true
muster-frame.workspace = true
muster-vt.workspace = true
prost.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc.workspace = true

# The daemon's tests live here because cargo only hands `CARGO_BIN_EXE_muster-daemon` to tests
# in the package that owns the binary, and every one of them runs the real binary.
[dev-dependencies]
libc.workspace = true
muster-harness.workspace = true
serde_json.workspace = true

[lints]
workspace = true
