<!--
  The same icon for the one bitmap too small to hold it.

  At 16 pixels a pane is four across, so its outline and its interior land on the
  same pixel and the three states turn to mud. This drops the interiors and keeps
  the three coloured panes, which is the half that still reads. Every larger size
  in the set renders icon.svg; see tools/make-icns.sh.
-->
