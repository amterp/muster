// Muster's API for other programs, served by muster-daemon (MIP-10).
//
// A program on the same machine as a daemon reads what Muster's agents are doing through this
// schema, and later acts on them. It is apart from the daemon's internal protocol
// (muster_daemon.proto), which serves Muster's own app, bridges and CLI and changes with them;
// this one changes on its own clock and has its own version. Generate bindings from this file
// alone: it imports nothing.
//
// ## Connecting
//
// The daemon listens on a Unix socket that only its user can open. A client finds it as
// `muster msg` does: `$MUSTER_DAEMON_SOCKET`, which every pane has, and otherwise this install's
// daemon under `~/.muster/daemon/`. Every frame either way is a four-byte big-endian length, then
// one message of at most 16 MiB. The client's first frame is a Hello and the daemon's is a
// HelloAnswer; after a Welcome the client sends Requests and the daemon sends DaemonMessages,
// until either end hangs up.
//
// The daemon reads a Hello's `kind` before anything else, and KIND_API is what makes the
// connection this API's. Field 2 is the one field this Hello shares with the internal protocol's,
// whose kinds take the values 1 to 4, so a client never names an internal version and is never
// judged by one. A daemon that predates this API answers an API Hello with its internal refusal,
// which reads here as a Refused with a reason.
//
// ## Versions
//
// `Version` is a major and a minor. The daemon serves a client of its own major whose version is
// no older than the oldest it still serves, and says its own version in Welcome and Refused. A
// client makes the same check of the daemon's version in Welcome, since a daemon cannot know of a
// break made after it was built: it reads only a daemon of its own major whose version is no older
// than the oldest its own build serves.
// Every change to this schema raises the minor. `muster_api.v<major>.baseline.proto` beside this
// file is the schema as the last release shipped it, and records which version that was; a test
// in muster-api fails when this file stops reading it or when the two versions disagree.
//
// The API is 0.x until Muster's own 1.0. Until then a change may break clients: it raises the
// minor, moves the oldest version the daemon serves up to it, and says so in the release notes.
// From 1.0, within a major, a request that is served keeps being served, a field it filled stays
// filled with the same meaning, an enum value keeps its meaning, and a field that should go is
// deprecated and still filled until the next major.
//
// ## What a client may not know yet
//
// Every enum has an unspecified zero. A client treats a value it does not know as unknown, and
// skips fields, events and messages it does not know. Welcome says what the daemon serves, down
// to each option that came in a later minor, so a client asks Welcome rather than finding out
// from a refusal.
//
// ## Requests and answers
//
// Every Request carries a correlation id the client chooses. Its Answer repeats it, and so does
// every event the request caused, on this connection only. Requests are namespaced by what they
// act on: `api.*` and `pane.*` here, and `msg.*`, `machine.*` and others as they come, each an
// arm of Request's oneof. A request the daemon does not know is refused, and the connection
// stays open.
//
// An answer is one of five outcomes:
//
// - DONE.
// - ALREADY_SO: nothing needed doing. A repeated operation id gets this, with the first answer's
//   result.
// - REFUSED: not done, and nothing happened. `refusal` says why in a word a program can act on,
//   NOT_FOUND when the thing named does not exist, and `reason` says it for a person. A refusal
//   code the client does not know means "for the reason given".
// - NOT_SENT: the request had to go to another machine and never left this daemon. Nothing
//   happened, and asking again is safe.
// - UNKNOWN: the request may have happened. It went to another machine and the reply was lost,
//   or it is still being carried out, or it started and its result was lost. A client never
//   treats unknown as refused. A request that makes something can be asked again with the same
//   operation id, which never makes it twice.
//
// A client has the same two cases of its own. A request it could not write is not sent. A
// request it wrote on a connection that ended before its answer arrived is unknown, even when
// the connection ended with an Ended.
//
// ## Operation ids
//
// A request that makes something carries an operation id the client chooses, unique among its
// own requests: a UUID will do. The daemon that carries the request out remembers the id for
// 24 hours, by the client's name in its Hello, across a reconnect, a handoff and an orderly
// restart. A repeat within that time is never carried out again:
//
// - one that was done is answered ALREADY_SO, with the first answer's result, even if what it
//   made is gone since;
// - one still being carried out is answered UNKNOWN; ask again later with the same id;
// - one that started and lost its result, such as a pane whose command ran and whose daemon
//   then handed over before the pane was placed, is answered UNKNOWN every time, since running
//   it again could do twice what it did; a new id carries it out anew;
// - an id used for a different request is refused OPERATION_REUSED.
//
// A request refused before anything happened is forgotten, so the client can put the cause
// right and ask again with the same id. A daemon holding 4096 operations refuses a new one as
// UNAVAILABLE rather than forget one early. A daemon that is killed or crashes may forget the
// operations of its last second, since it saves what it holds about a second after a change.
//
// ## Subscribing
//
// `api.subscribe` names the topics the client wants. Its answer carries a snapshot, and every
// event after it follows on the same connection. One connection holds one subscription; subscribing
// again replaces it.
//
// - Numbers belong to the subscription. Each subscription has an epoch, chosen when it starts,
//   and numbers its events one after another from 1. A topic the client did not ask for takes no
//   numbers. A gap in the numbers, or a new epoch, means the client subscribes again.
// - The snapshot joins the stream without a gap: `Snapshot.through` is the number it is current
//   to, and the next event carries the number after it.
// - Every event names its source: the daemon it came from, by an identity fixed when that
//   daemon's install first started, and that daemon's instance, which changes every time it
//   starts or is replaced. Display names travel beside the identity and are never it.
// - A snapshot is a view of independent sources, each with its state in `Snapshot.sources`:
//   current, restoring, catching up or unreachable. Events from one source keep that source's
//   order; events from different machines have no order between them.
// - An answer comes after its events. The events a request caused reach the subscription before
//   its answer, and `Answer.through` is the number of the last event the connection had been sent
//   when it was answered.
// - Reading changes nothing: subscribing moves nobody's place in any group and clears nothing.
//
// ## Panes
//
// TOPIC_PANES holds every pane its daemon runs, each as a whole Pane: in the snapshot, and again
// in an event when it appears, when anything a client reads of it changes, and an id when it
// closes. A client replaces what it holds of a pane with each event's. Nothing fires for a pane's
// output, and a title on its own fires nothing either, since a harness redraws its title while it
// works; every event and snapshot carries the latest title.
//
// ## Ending
//
// The daemon ends a connection with an Ended saying why, when it can:
//
// - FELL_BEHIND: the client stopped reading, and what the daemon queued for it passed its budget
//   of 4096 messages or 32 MiB. The daemon drops what it had queued and sends Ended after the
//   frame it was writing, with `reached`, the number of the last event written. A client that
//   does not read within 5 seconds of falling behind is hung up on without it.
// - REPLACED: a newer daemon took over this one's panes (MIP-3 section 10). The client connects
//   to the same socket, where the successor serves, and subscribes again in a new epoch.
// - STOPPING: the daemon is exiting.
//
// A connection that ends without an Ended ended for a reason the daemon could not say, such as
// the daemon being killed.

syntax = "proto3";

package muster.api;

// ---------------------------------------------------------------------------------------------
// Handshake

message Version {
  uint32 major = 1;
  uint32 minor = 2;
}

enum Kind {
  KIND_UNSPECIFIED = 0;
  // Values 1 to 4 are the internal protocol's kinds of connection.
  reserved 1 to 4;
  KIND_API = 5;
}

// The first frame on a connection, from the client.
message Hello {
  // The internal protocol's version and client, which an API client never sends.
  reserved 1, 3;
  // Always KIND_API.
  Kind kind = 2;
  // The API version the client speaks.
  Version api = 4;
  Client client = 5;
}

// Who is connecting. Attribution, not identity: anything running as the user can claim any name.
// The daemon's log records it.
message Client {
  // A short, stable name for the program: "foreman", "quartermaster".
  string name = 1;
  // The program's own version, for a person reading the daemon's log.
  string version = 2;
}

// The first frame on a connection, from the daemon. After a refusal the daemon hangs up.
message HelloAnswer {
  // The internal protocol's Welcome.
  reserved 1;
  oneof answer {
    Refused refused = 2;
    Welcome welcome = 3;
  }
}

message Refused {
  string reason = 1;
  // The internal protocol's version, which a daemon older than this API sends here.
  reserved 2;
  // The API version the daemon speaks. Absent from a daemon older than this API.
  Version api = 3;
}

message Welcome {
  // The API version the daemon speaks.
  Version api = 1;
  // The daemon this connection reached.
  Machine machine = 2;
}

// A daemon, and the machine it runs on.
message Machine {
  Source source = 1;
  // What to call the machine, for a person: its host name. Not an identity.
  string name = 2;
  // The daemon's own build, for a person: Muster's version.
  string version = 3;
  // What this daemon serves.
  Features features = 4;
}

// Where an event, a pane or a group comes from.
message Source {
  // The daemon's identity: fixed when its install first started, and never changed. A daemon
  // that replaces another keeps it.
  string daemon = 1;
  // This run of the daemon. A daemon that restarts or is replaced has a new one.
  uint64 instance = 2;
}

// What a daemon serves.
message Features {
  // Every request, by its namespaced name: "api.subscribe".
  repeated string requests = 1;
  // Every topic a subscription may name.
  repeated Topic topics = 2;
  // Every option of a request that came in a later minor than the request, as
  // "<request>.<option>".
  repeated string options = 3;
}

// ---------------------------------------------------------------------------------------------
// Requests

message Request {
  // Chosen by the client and repeated in the answer. The daemon never reads it, so it may be
  // anything, empty included.
  string correlation = 1;
  // Namespaced by what a request acts on. A namespace added later takes the next arm.
  oneof request {
    ApiRequest api = 10;
    PaneRequest pane = 11;
  }
}

// Requests about the connection itself.
message ApiRequest {
  oneof request {
    // "api.subscribe": answered with a Snapshot, then every event after it.
    Subscribe subscribe = 1;
  }
}

message Subscribe {
  // The topics to hear. None hears no topic: a snapshot of the sources, and their changes. A
  // topic named twice counts once, and one the daemon does not serve is refused, naming it.
  repeated Topic topics = 1;
}

enum Topic {
  TOPIC_UNSPECIFIED = 0;
  // Every pane and its agent's state.
  TOPIC_PANES = 1;
  // Every daemon this one answers for, with its features.
  TOPIC_MACHINES = 2;
  // Every group, its members and its posts.
  TOPIC_MESSAGES = 3;
  // What waits on the human, and their presence at the desk.
  TOPIC_ATTENTION = 4;
}

// Requests about panes.
message PaneRequest {
  oneof request {
    // "pane.new": answered with Made.
    NewPane new = 1;
  }
}

// A pane running a command in a directory, as `muster pane new --run` makes one. It gets a tab
// of its own, which a window shows as soon as one is open, unless it is a helper or hidden.
message NewPane {
  // Required: the header's "Operation ids" says why.
  string operation = 1;
  // The daemon to make it on, by its identity (`Source.daemon`). Empty is the daemon answering;
  // any other is refused NOT_FOUND by a daemon that answers for no other.
  string machine = 2;
  // A shell line for the pane's shell to run as it starts. Empty starts the shell alone.
  string run = 3;
  // An absolute path to start in. Empty is the maker's directory for a helper, else the daemon's
  // home.
  string directory = 4;
  // What to call the pane. Empty gives it its callsign alone.
  string name = 5;
  // The pane, by its id, that this one is a helper of: it is hidden in the tab its maker's
  // helpers share and listed under its maker, as `muster pane new --helper` makes one.
  string helper_of = 6;
  // In a hidden tab of its own, which no window shows until a person shows it.
  bool hidden = 7;
  // Raises nothing for the person: no notification. Unset is quiet for a helper, whose maker is
  // told when it needs somebody, and not quiet for any other pane.
  optional bool quiet = 8;
}

// What a pane.new made.
message Made {
  // The pane's id, which names it in every request.
  string pane = 1;
  // The word Muster calls it by (`otter`).
  string callsign = 2;
}

// ---------------------------------------------------------------------------------------------
// From the daemon

message DaemonMessage {
  oneof message {
    Answer answer = 1;
    Event event = 2;
    Ended ended = 3;
  }
}

message Answer {
  // The request's.
  string correlation = 1;
  Outcome outcome = 2;
  // Why, for a person, when it was not done.
  string reason = 3;
  // The connection's subscription when the request was answered: its epoch, and the number of the
  // last event it had been sent. Both 0 on a connection that has not subscribed.
  uint64 epoch = 4;
  uint64 through = 5;
  // Why it was refused, when it was.
  Refusal refusal = 6;
  oneof detail {
    Snapshot snapshot = 10;
    Made made = 11;
  }
}

// The schema's header says what each outcome promises.
enum Outcome {
  OUTCOME_UNSPECIFIED = 0;
  OUTCOME_DONE = 1;
  OUTCOME_REFUSED = 2;
  OUTCOME_ALREADY_SO = 3;
  OUTCOME_NOT_SENT = 4;
  OUTCOME_UNKNOWN = 5;
}

enum Refusal {
  // For the reason the answer gives.
  REFUSAL_UNSPECIFIED = 0;
  // A pane, machine or other thing the request names does not exist.
  REFUSAL_NOT_FOUND = 1;
  // This daemon serves no such request, topic or option. Welcome lists what it serves.
  REFUSAL_UNSUPPORTED = 2;
  // The request is missing something it needs, or holds something it cannot.
  REFUSAL_INVALID = 3;
  // The operation id was used for a different request, which the daemon still remembers.
  REFUSAL_OPERATION_REUSED = 4;
  // The daemon cannot take the request now: it is stopping, handing over to a newer daemon, or
  // remembering as many operations as it holds. Ask again shortly.
  REFUSAL_UNAVAILABLE = 5;
}

// Where a subscription starts. Each topic's part is filled only when the subscription named it.
message Snapshot {
  uint64 epoch = 1;
  // The number the snapshot is current to. The first event after it carries the next.
  uint64 through = 2;
  // The topics this subscription hears.
  repeated Topic topics = 3;
  // Every source the snapshot holds, with its state, whatever the topics.
  repeated SourceStatus sources = 4;
  // TOPIC_MACHINES: every daemon this one answers for, itself first.
  repeated Machine machines = 10;
  // TOPIC_PANES: every pane.
  repeated Pane panes = 11;
}

message SourceStatus {
  Source source = 1;
  SourceState state = 2;
}

enum SourceState {
  SOURCE_STATE_UNSPECIFIED = 0;
  // What the snapshot holds of this source is what it holds now.
  SOURCE_STATE_CURRENT = 1;
  // The daemon is bringing back the panes it held before it restarted, so some may be missing.
  SOURCE_STATE_RESTORING = 2;
  // The link to this source is back, and its changes since are still arriving.
  SOURCE_STATE_CATCHING_UP = 3;
  // The link to this source is down; what the snapshot holds is what was last known.
  SOURCE_STATE_UNREACHABLE = 4;
}

// One change. Topics' events take arms from 20 on: panes in the 20s, messages in the 30s and
// attention in the 40s.
message Event {
  uint64 epoch = 1;
  uint64 number = 2;
  Source source = 3;
  // The correlation id of the request on this connection that caused the event. Empty for an
  // event that no request of this connection caused.
  string correlation = 4;
  oneof event {
    // Whatever the topics.
    SourceChanged source_changed = 10;
    // TOPIC_PANES.
    PaneAppeared pane_appeared = 20;
    PaneChanged pane_changed = 21;
    PaneClosed pane_closed = 22;
  }
}

message SourceChanged {
  SourceStatus status = 1;
}

message PaneAppeared {
  Pane pane = 1;
}

// The pane as it is now, whole.
message PaneChanged {
  Pane pane = 1;
}

message PaneClosed {
  string pane = 1;
}

// ---------------------------------------------------------------------------------------------
// Panes

// A terminal its daemon runs, and the agent in it, if any.
message Pane {
  // Its id, which no other pane has on any machine and which it keeps for life.
  string pane = 1;
  // The daemon running it.
  Source source = 2;
  // A short word its daemon drew for it (`otter`), which `muster` takes wherever it takes a
  // pane, and which no other live pane on that machine holds. Kept through a rename.
  string callsign = 3;
  // The name somebody gave it. Empty while nobody has.
  string name = 4;
  // What the program in it last called itself.
  string title = 5;
  // Its program's working directory.
  string directory = 6;
  // The agent running in it, by the name of the harness its daemon recognized (`claude`,
  // `codex`). Empty while it runs none that its daemon recognizes.
  string harness = 7;
  PaneState state = 8;
  // When its daemon saw the agent enter its state, in milliseconds since the Unix epoch by that
  // daemon's clock. Waiting and done are laid over the state this dates, so a waiting pane's
  // `since_ms` is when it went idle, and a done one's when it finished. Absent when the daemon
  // did not see the state begin: an agent a restart resumed has none until its state next
  // changes.
  optional uint64 since_ms = 9;
  // What the agent says about itself, through its harness's adapter.
  Facts facts = 10;
  // Input its program has left unread, while it has stopped reading. Absent while it reads.
  UnreadInput unread_input = 11;
  // The id the agent's harness gives its session. Empty while it has reported none.
  string session = 12;
  // The pane that made this one as its helper, by id, which may be on another machine. Empty for
  // a pane nobody made as one.
  string maker = 13;
  // No window shows it; it goes on running.
  bool hidden = 14;
  // Nothing about it asks for the human: no banner, and no notification.
  bool quiet = 15;
  Adapter adapter = 16;
}

// What a pane's agent is doing, as Muster's window shows it.
enum PaneState {
  PANE_STATE_UNSPECIFIED = 0;
  // No agent its daemon recognizes, or one not yet read.
  PANE_STATE_UNKNOWN = 1;
  PANE_STATE_WORKING = 2;
  // Waiting on the human, at a dialog or a question.
  PANE_STATE_BLOCKED = 3;
  PANE_STATE_IDLE = 4;
  // Idle, having said what it waits on (`Facts.waiting`).
  PANE_STATE_WAITING = 5;
  // Its program has stopped reading its input (`Pane.unread_input`).
  PANE_STATE_STUCK = 6;
  // It finished something - stopped working, or ended - that no window has shown anybody.
  PANE_STATE_DONE = 7;
}

// What a pane's agent says about itself. Each field is absent or empty until it says it.
message Facts {
  // How full its context is, as a percentage.
  optional float context_used = 1;
  // How many sub-agents it is running.
  uint32 subagents = 2;
  string model = 3;
  // What its session has cost so far, in US dollars.
  optional double cost_usd = 4;
  // What it waits on while idle, in its own words.
  string waiting = 5;
  // Anything else it says, by name.
  map<string, string> other = 6;
}

message UnreadInput {
  // Bytes waiting for the program to read: whole lines only, when the terminal is line by line.
  uint32 bytes = 1;
  // Since when, in milliseconds since the Unix epoch by the daemon's clock.
  uint64 since_ms = 2;
  // The program holding the terminal, and its process id.
  string program = 3;
  int32 pid = 4;
}

// Whether a pane's agent reports itself through its harness's adapter, which is where its facts,
// and its state when it says it, come from.
enum Adapter {
  ADAPTER_UNSPECIFIED = 0;
  // Nothing to say yet: no agent, or one that has not ended a turn.
  ADAPTER_UNSAID = 1;
  ADAPTER_REPORTING = 2;
  // It ended a turn without reporting, and Muster ships an adapter for its harness: install it.
  ADAPTER_SILENT = 3;
  // It ended a turn without reporting, and Muster ships no adapter for its harness.
  ADAPTER_NONE = 4;
}

// The daemon's last word on a connection, after which it hangs up.
message Ended {
  Reason reason = 1;
  // The subscription's epoch and the number of the last event written to the connection; 0 on a
  // connection that had not subscribed.
  uint64 epoch = 2;
  uint64 reached = 3;
  // Why, for a person.
  string detail = 4;

  enum Reason {
    REASON_UNSPECIFIED = 0;
    // The client stopped reading and passed its budget.
    REASON_FELL_BEHIND = 1;
    // A newer daemon took over, and serves the same socket.
    REASON_REPLACED = 2;
    // The daemon is exiting.
    REASON_STOPPING = 3;
  }
}
