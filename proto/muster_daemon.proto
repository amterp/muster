// What Muster says to muster-daemon, and what the daemon says back (MIP-3, section 9).
//
// The daemon owns every pane's PTY on one machine and outlives the app, so an app routinely
// talks to a daemon built from a different commit: it adopts whichever one is running rather
// than ending every agent to start its own. This file is therefore a compatibility promise in a
// way muster.proto mostly is not, and the rules below are what keep the promise.
//
// ## Connections
//
// Every connection to the daemon's socket carries frames as muster-frame writes them: a
// four-byte big-endian length, then a message. The first frame each way is the handshake: the
// client sends a Hello naming the kind of connection and the protocol version it speaks, and
// the daemon answers with a HelloAnswer before anything else. There are three kinds:
//
// - control, one per app per daemon: Request in, ControlMessage (answers and events) out;
// - input, one per app per daemon: InputEvent in, nothing out. Never acknowledged, and never
//   queued behind a large answer on the control connection;
// - stream, one per bridge: StreamRequest in, StreamMessage out, for one pane's bytes;
// - peer, one per pair of linked daemons on different machines: PeerFrame both ways, so that
//   either can call the other over a connection only one of them could dial.
//
// ## Answers and events
//
// Every event carries a sequence number, increasing by one within a daemon's lifetime and
// starting again when the daemon does. Welcome and Snapshot carry `instance`, which names that
// lifetime, so a client can tell a restarted daemon's numbers from the old one's.
//
// Subscribing answers with a snapshot and the sequence number it is current to. Every event
// after it follows on the same connection, in order, and nothing from before it. On a subscribed
// connection, the events a request produced arrive before its answer, and the answer's `seq`
// names the last of them. So a client applies events only, and uses an answer to learn when its
// request has taken effect. A client that sees a gap, or whose connection the daemon drops for
// falling behind, subscribes again.
//
// A tab's tree never names a pane the client has not been told about: a pane is opened before
// any tree holds it, and leaves every tree before it is closed.
//
// ## The daemon's log
//
// A control connection that sends FollowLog also gets the daemon's own log, a LogLine per
// record, interleaved with its answers and events and numbered apart from them. The daemon keeps
// its log in a file of its own beside its socket, and never in a run's log, since it outlives
// every run; this is how a run's log gets the daemon's side of the story, on this machine or
// another. What a person typed is never in it.
//
// ## Compatibility
//
// `Version.major` changes when a message stops meaning what it meant. A client talks only to a
// daemon with its own major, and the daemon refuses the handshake otherwise. `Version.minor`
// grows with any change to this schema, so a client can tell whether a daemon it adopted knows a
// request before sending it. A daemon handed a request it does not know answers REFUSED; it
// never reads it as something else.
//
// So a field keeps its number and its type for as long as the major lasts. Removing one means
// reserving its number. `muster_daemon.v<major>.baseline.proto` beside this file is the schema as
// the last minor was published, and records which version that was. A test in
// muster-daemon-proto fails when anything in the baseline has moved here, and when the two
// versions disagree: a schema that differs from its baseline is the next minor, and each minor
// that ships becomes the baseline before the next one starts. Until a release ships the daemon,
// nothing has adopted this schema, so a change simply replaces the baseline; from that release
// on, an incompatible change is a new major.

syntax = "proto3";

package muster.daemon;

// ---------------------------------------------------------------------------------------------
// Handshake

message Version {
  uint32 major = 1;
  uint32 minor = 2;
}

enum ConnectionKind {
  CONNECTION_KIND_UNSPECIFIED = 0;
  CONNECTION_KIND_CONTROL = 1;
  CONNECTION_KIND_INPUT = 2;
  CONNECTION_KIND_STREAM = 3;
  CONNECTION_KIND_PEER = 4;
}

// The first frame on every connection, from the client.
message Hello {
  Version protocol = 1;
  ConnectionKind kind = 2;
  // Who is asking, for the daemon's log: "muster 0.9.0", "muster-bridge p1w3r07bsd".
  string client = 3;
}

// The first frame on every connection, from the daemon. After a refusal the daemon hangs up.
message HelloAnswer {
  oneof answer {
    Welcome welcome = 1;
    HelloRefused refused = 2;
  }
}

message Welcome {
  Version protocol = 1;
  // The daemon's own build, for a person reading a log: Cargo's package version.
  string daemon_version = 2;
  // Which install the daemon belongs to (muster-daemon-proto's `install`), so a client can
  // tell a dev daemon from a release one when it reports what it adopted.
  string install = 3;
  // This daemon lifetime. Sequence numbers from a different instance are not comparable.
  uint64 instance = 4;
  uint32 pid = 5;
  // What the daemon was started with `--launch`, empty when it was not. A starter passes a
  // token of its own and tells its daemon from another start's by it, where it cannot see a
  // pid: a daemon started through Launch Services is not its child.
  string launch = 6;
}

message HelloRefused {
  string reason = 1;
  // What the daemon speaks, so a client refused for its version can say which one it met.
  Version daemon = 2;
}

// ---------------------------------------------------------------------------------------------
// Control: requests

// Everything a client asks on a control connection. Namespaced by service, so a service added
// later takes an arm of its own, as messages between agents did.
message Request {
  // Chosen by the client and echoed in the answer. Requests on one connection are answered in
  // the order they were sent.
  uint64 id = 1;
  oneof service {
    SessionRequest session = 10;
    TabRequest tab = 11;
    PaneRequest pane = 12;
    MsgRequest msg = 13;
  }
}

message SessionRequest {
  oneof request {
    // The daemon's state now, without subscribing.
    Snapshot snapshot = 1;
    // The daemon's state now, and every event after it on this connection.
    Subscribe subscribe = 2;
    SetShell set_shell = 3;
    SetScrollback set_scrollback = 4;
    SetPalette set_palette = 5;
    SendManifests send_manifests = 6;
    // Close every pane and exit. Answered before the daemon goes.
    Stop stop = 7;
    SetClipboardWrite set_clipboard_write = 8;
    SetCursor set_cursor = 9;
    // The daemon's recent log, then every record after it, on this connection.
    FollowLog follow_log = 10;
    // Hand every pane to a new daemon, which serves this socket from then on, and exit, ending
    // no pane (MIP-3 section 10). Answered DONE once the new daemon serves, just before this
    // one exits. REFUSED with the reason when it cannot be done, and then this daemon goes on
    // serving as before. While it runs, a request that changes anything is refused.
    Replace replace = 11;
    SetScrollMultiplier set_scroll_multiplier = 12;
    // How big every pane's terminal is. A read: it changes nothing and produces no event.
    ReadGrids read_grids = 13;
    // Since 1.3.
    SetNameSessions set_name_sessions = 14;
    // Since 1.3.
    SetHumanName set_human_name = 15;
    // Since 1.3.
    SetCompactAt set_compact_at = 16;
    // Since 1.3.
    SetResumeAgents set_resume_agents = 17;
  }

  message Snapshot {}
  message Subscribe {
    // Sent by a window on the machine this daemon runs on, which tells the human what waits
    // for them (MIP-4, section 10): while one attends, a message for the human wakes them, and
    // `human_notice` events say what waits. A window never attends a daemon over ssh, since
    // the human is homed on the machine the app runs on.
    bool attends = 1;
  }
  message Stop {}

  message Replace {
    // The daemon to start. Absent: the executable this one started from.
    optional string program = 1;
    // The new daemon's `--data`. Absent: the directory it finds for itself.
    optional string data = 2;
  }

  // Answered with Grids. A pane's size is the one its program last saw: what the last bridge to
  // draw it asked for, or the size it was made at. A pane nothing is drawing keeps that size,
  // which is still what wraps its output, so it is answered rather than left out. Asked rather
  // than carried on Pane, because a window being resized changes every size many times a second
  // and nothing but somebody asking about the layout reads them.
  message ReadGrids {}

  // Answered with LogFollowed. REFUSED when the daemon's log is off.
  message FollowLog {
    // The last record the client already has, from a connection to this same daemon run
    // (`instance`). Absent: every record the daemon still holds, which is its last thousand.
    optional uint64 after = 1;
  }
}

message TabRequest {
  oneof request {
    Close close = 1;
    Rename rename = 2;
    SetSplitRatio set_split_ratio = 3;
  }

  // Closes the tab and every pane in it.
  message Close {
    string tab = 1;
  }

  // A lower generation than the one recorded is refused: the client that sent it has not seen
  // the latest name.
  message Rename {
    string tab = 1;
    Label label = 2;
  }

  message SetSplitRatio {
    string tab = 1;
    // The turns from the tab's root to the split.
    repeated Branch path = 2;
    // The first child's share, strictly between 0 and 1.
    float ratio = 3;
  }
}

message PaneRequest {
  oneof request {
    Create create = 1;
    Close close = 2;
    Resize resize = 3;
    Zoom zoom = 4;
    Swap swap = 5;
    Move move = 6;
    Rename rename = 7;
    Read read = 8;
    Report report = 9;
    Seen seen = 10;
    // Since 1.3.
    Compact compact = 11;
  }

  // Somebody has seen these panes: a window with the keyboard shows them. Clears each one's
  // `finished_unseen`. Sent when a focused window comes to show a pane, and for every pane it
  // shows when it gains the keyboard. ALREADY_SO when none had anything unseen. A pane not on
  // this daemon, as one that closed while this was sent, is named in the answer's reason and
  // does not stop the others being seen; NOT_THERE only when none of them is here.
  message Seen {
    repeated string panes = 1;
  }

  // Compacts the context of the agent in a pane, by typing what its manifest gives in `[session]
  // compact` at its prompt once it is idle and the prompt is empty, under the doorbell's rules,
  // never while it works (MIP-5, section 10). DONE once it is to be typed, which may be long
  // before it is: the agent's turn ends first. REFUSED, with the reason, when the pane runs no
  // agent, the agent's manifest says no way to compact it, or the focus cannot be typed or taken.
  // A second request before the first is typed replaces it.
  message Compact {
    string pane = 1;
    // What the compaction should keep, typed after the command where the manifest says the
    // harness takes it. One line. Absent or blank: compacted without one.
    optional string focus = 2;
  }

  // Starts a pane. A pane of that name already here answers ALREADY_SO, so a create retried
  // after its answer was lost does not start a second process.
  message Create {
    // Muster's name for it (`p1w3r07bsd`), which the process sees as MUSTER_PANE from birth.
    string pane = 1;
    Placement placement = 2;
    // The pane's size from birth. Absent: the size of the pane it is placed beside, or 80x24 in
    // a new tab.
    optional Grid grid = 3;
    // Absent: the current directory of the pane it is placed beside, or the daemon's home.
    optional string cwd = 4;
    // Added to the pane's environment. MUSTER_SOCKET travels here: it names the window, which
    // the daemon knows nothing about.
    map<string, string> env = 5;
    // Run through the pane's shell, which the pane drops back to when it exits.
    optional string command = 6;
    optional string label = 7;
  }

  // Hangs the pane up: SIGHUP to its process groups, then the PTY closed.
  message Close {
    string pane = 1;
  }

  // Moves the nearest divider on `direction`'s axis in that direction, preferring one on that
  // side of the pane.
  message Resize {
    string pane = 1;
    Side direction = 2;
    // A share of the split's area. Absent: the daemon's step.
    optional float fraction = 3;
  }

  message Zoom {
    string pane = 1;
    bool zoomed = 2;
  }

  // Exchanges two panes' places. Both are in one tab.
  message Swap {
    string pane = 1;
    string with = 2;
  }

  message Move {
    string pane = 1;
    Placement placement = 2;
  }

  message Rename {
    string pane = 1;
    // Absent takes the name away.
    optional string label = 2;
  }

  // A page of the text on a pane's active screen, by row: row 0 is the oldest row of history the
  // pane still holds. A page does not shift as output arrives until history reaches the pane's
  // scrollback limit; from then on, each row trimmed from the top moves every row up by one.
  message Read {
    string pane = 1;
    uint64 first_row = 2;
    // Zero reads to the last row. Either way a page stops at 4 MiB of text, well under the
    // largest message, and the answer says how many rows it holds.
    uint32 rows = 3;
    // When set, the page is the last `last` rows ending at the last row with anything on it, and
    // `first_row` and `rows` are not read: a reader after the newest rows is sent those rather
    // than the history before them, and not the blank rest of the screen beneath a prompt. A
    // daemon that predates it reads from `first_row` as asked.
    uint32 last = 4;
    // Since 1.3. When set, the page is what the pane's agent printed since it last went to work:
    // from the first row that differs from what the screen showed at that moment, to the last row
    // with anything on it, the newest kept when that passes 4 MiB. `first_row`, `rows` and
    // `last` are not read. Refused when no turn has started since this daemon began watching the
    // pane. A daemon that predates it answers without `PaneText.turn`.
    bool turn = 5;
  }

  // Facts the agent in a pane states about itself, sent from inside the pane
  // (`muster-daemon report`, which a harness's hooks and statusline call). Each field present
  // replaces what the pane held; `clear` forgets everything first. A report outside the bounds
  // on `AgentFacts` is refused whole.
  message Report {
    string pane = 1;
    optional float context_used = 2;
    // Empty removes the model.
    optional string model = 3;
    optional double cost_usd = 4;
    SubagentChange subagent = 5;
    // An empty value removes its key.
    map<string, string> facts = 6;
    bool clear = 7;
    // The agent reporting, by its manifest's name, and the state it says it is in: working,
    // blocked or idle. A state outranks what detection reads off the screen while it is fresh
    // (MIP-3 section 8) and counts only while detection finds that agent in the pane. A state
    // needs its agent.
    string agent = 8;
    optional AgentState state = 9;
    // What the agent is waiting on (AgentFacts.waiting). Empty clears it.
    optional string waiting = 10;
    // Since 1.3. What the agent's harness calls its session; empty when it has no name. The
    // pane takes a name the session is given after it started, and gives the session its own
    // name otherwise (MIP-5, section 10). Needs its agent, and counts only while detection
    // finds that agent in the pane, or none yet.
    optional string session_name = 11;
    // Since 1.3. The harness's id for its session, which its own commands name it by: a wake
    // reaches the session through the command its manifest's `[session] wake` names
    // (MIP-5, section 7). Needs its agent, and counts only while detection finds that agent in
    // the pane. Empty forgets it.
    optional string session_id = 12;
  }
}

enum SubagentChange {
  SUBAGENT_CHANGE_NONE = 0;
  // One more sub-agent is running. The daemon keeps the count, since a harness reports each
  // sub-agent's start and stop rather than how many are running.
  SUBAGENT_CHANGE_STARTED = 1;
  // One fewer, never below none.
  SUBAGENT_CHANGE_STOPPED = 2;
}

// Where a pane goes: beside one that exists, or into a tab of its own.
message Placement {
  oneof where {
    Beside beside = 1;
    NewTab new_tab = 2;
  }

  message Beside {
    string pane = 1;
    Side side = 2;
    // The existing pane's share afterwards. Absent: half.
    optional float ratio = 3;
  }

  // A tab named `tab` must not already be here. A Muster tab grouped across two machines is a
  // tab of that name on each daemon.
  message NewTab {
    string tab = 1;
    Label label = 2;
  }
}

message SetShell {
  Shell shell = 1;
}

// What a new pane runs. A pane already running keeps what it started with.
message Shell {
  // The program. Absent: $SHELL, or the account's shell.
  optional string command = 1;
  ShellMode mode = 2;
  // Ghostty's shell integration features, each absent for its default. ssh-env: ssh forwards the
  // terminal's name and colors (on). ssh-terminfo: ssh installs xterm-ghostty on a host that
  // lacks it (on). sudo: sudo keeps the terminal's terminfo, which needs a sudoers rule that
  // allows SETENV (off).
  optional bool ssh_env = 3;
  optional bool ssh_terminfo = 4;
  optional bool sudo = 5;
}

enum ShellMode {
  // The daemon's own choice, which is a login shell.
  SHELL_MODE_DEFAULT = 0;
  SHELL_MODE_LOGIN = 1;
  SHELL_MODE_NON_LOGIN = 2;
}

message SetScrollback {
  // History a pane keeps. Absent: the daemon's own depth.
  optional uint64 bytes = 1;
}

// Whether programs may write the clipboard (OSC 52), which the app applies. The daemon only
// needs to know so that a program asking what the terminal supports is told the truth.
message SetClipboardWrite {
  bool allowed = 1;
}

// How far a wheel turn scrolls a program that gets it as arrow keys or wheel reports, as a
// multiple of Ghostty's own distances: 1 is Ghostty's, 2 is twice as far. Applied after a
// notch is rounded up to at least one, as Ghostty applies its `mouse-scroll-multiplier`, so
// a multiplier below 1 slows a wheel as it slows the window's own scrolling. Finite and above
// zero, or refused.
message SetScrollMultiplier {
  double multiplier = 1;
}

// Whether naming a pane types its name into its agent's session, as the agent's manifest says
// to rename it (MIP-5, section 10). A session renamed in its harness renames the pane either way.
message SetNameSessions {
  bool name = 1;
}

// Whether a pane whose agent reported its session's id starts that session again when a restart
// brings the pane back, as the agent's manifest says to resume it, with the arguments the agent
// was running with. Off: the pane comes back as a shell, as every pane did before.
message SetResumeAgents {
  bool resume = 1;
}

// How full an agent's context gets before the daemon compacts it, as a Compact for its pane
// would, once each time a report crosses it. Absent: never.
message SetCompactAt {
  optional float percent = 1;
}

// What messages call the human where they show it (MIP-4, section 10): `who` and the framing of
// `read` and `log` put it beside the address, which stays `@human`. Absent or empty: shown by
// the address alone.
message SetHumanName {
  optional string name = 1;
}

message SetPalette {
  Palette palette = 1;
}

// The app's cursor setting. The app draws the cursor; the daemon needs it only because Ghostty's
// shell integration changes the cursor at every prompt, and whether it may is decided from this
// (MIP-3, section 3). A pane already running keeps what it started with.
message SetCursor {
  Cursor cursor = 1;
}

message Cursor {
  CursorStyle style = 1;
  // Absent leaves it to the program in the pane.
  optional bool blink = 2;
}

enum CursorStyle {
  // None named.
  CURSOR_STYLE_UNSPECIFIED = 0;
  CURSOR_STYLE_BLOCK = 1;
  CURSOR_STYLE_BAR = 2;
  CURSOR_STYLE_UNDERLINE = 3;
  CURSOR_STYLE_HOLLOW = 4;
}

// The colours programs are told the terminal has, when they ask.
message Palette {
  // 0xRRGGBB, index order. Up to 256.
  repeated uint32 entries = 1;
  uint32 foreground = 2;
  uint32 background = 3;
  optional uint32 cursor = 4;
  ColorScheme scheme = 5;
}

enum ColorScheme {
  COLOR_SCHEME_UNSPECIFIED = 0;
  COLOR_SCHEME_DARK = 1;
  COLOR_SCHEME_LIGHT = 2;
}

// Agent detection rules, sent by the app so a detection fix reaches a daemon it adopted.
message SendManifests {
  // The detection engine version the manifests were written for.
  uint32 engine = 1;
  repeated Manifest manifests = 2;
}

message Manifest {
  string agent = 1;
  string toml = 2;
}

// ---------------------------------------------------------------------------------------------
// Control: messages between agents (MIP-4)
//
// Agents post to groups and are woken when something arrives for them, rather than typing into
// each other's panes. The daemon keeps each group's log and every participant's read cursor, and
// refuses a post while its author has unread messages in that group. Nothing here names a pane:
// a Claude session in a plain terminal takes part the same way as one in a pane. A message's body
// never enters the daemon's log.

message MsgRequest {
  // Who is asking, as its environment says. Every request identifies its caller by `as_name`,
  // else by its inbox, else it is the human (MIP-4, section 3).
  Caller caller = 1;
  oneof request {
    Join join = 10;
    Leave leave = 11;
    Who who = 12;
    Post post = 13;
    Read read = 14;
    Log log = 15;
    Wait wait = 16;
    Groups groups = 17;
    GroupNew group_new = 18;
    GroupSet group_set = 19;
    GroupMembers group_members = 20;
    Pause pause = 21;
    Resume resume = 22;
    Peer peer = 23;
    // Since 1.3.
    GroupDelete group_delete = 24;
  }

  message Caller {
    optional string as_name = 1;
    // Claude Code's `CLAUDE_CODE_MESSAGING_SOCKET`, which is the same in every command a
    // session runs, and how the daemon wakes it.
    optional Inbox inbox = 2;
    optional string pane = 3;
    // Where the caller runs, which names a caller that never gave a name.
    optional string directory = 4;
  }

  message Inbox {
    string socket = 1;
    // The socket file's inode. The path is a process id, which the system reuses; the inode
    // tells a new session at the same path from the one that has gone.
    uint64 inode = 2;
  }

  // Registers the caller, under `name` or the name it already has, and joins `group`, creating
  // it if it does not exist.
  message Join {
    optional string name = 1;
    optional string group = 2;
    // The caller's hooks fetch its messages (MIP-4, section 6), so nothing rings it while they
    // run.
    bool pull = 3;
  }

  // Leaves `group`, or with none leaves every group and stops being a participant.
  message Leave {
    optional string group = 1;
  }

  message Who {
    optional string group = 1;
  }

  // Appends a message and wakes whom it is for. Without a group, it goes to the one group its
  // author and addressees share, or to the group of exactly them.
  message Post {
    optional string group = 1;
    repeated string to = 2;
    string body = 3;
    // Since 1.3. Rings an agent in a pane while it works, at a prompt read as empty, rather
    // than once it is idle, and wakes an addressee woken already. Refused as `not_urgent` when
    // the group's policy does not let the author, and as `urgent_unsupported` when the group is
    // kept on a machine whose daemon speaks a protocol before 1.3.
    bool urgent = 4;
  }

  // The caller's unread entries, moving its cursor past them.
  message Read {
    optional string group = 1;
  }

  // A group's entries after `since`, moving nothing.
  message Log {
    string group = 1;
    uint64 since = 2;
    // Answered only once there is an entry after `since`, at once if there already is: what
    // `muster msg log --follow` asks again and again. Refused as `ended` by a handover, like
    // a wait, so the caller asks whichever daemon serves next.
    bool follow = 3;
  }

  // A group's rules (MIP-4, section 8). Names are participants' names, `*` for anyone, and
  // `@human` for the human.
  message Policy {
    // Whom an unaddressed post wakes, by author; `*` is any author, or every member but the
    // human, whom a set wakes only by naming `@human`.
    map<string, Names> ring = 1;
    // Whom an author may address, by author.
    map<string, Names> allow = 2;
    // Who may add or remove members, themselves included, and change the policy.
    repeated string membership = 3;
    // Read when a group is made; `group set` leaves it as it is, and pause and resume change it.
    bool paused = 4;
    // Since 1.3. Who may post urgently; none is anyone.
    optional Names urgent = 5;
  }

  message Names {
    repeated string names = 1;
  }

  // Every group this daemon holds, with its members and policy.
  message Groups {}

  // Makes a group, with `policy` or the default, and the caller its first member. Refused as
  // `group_exists` when it is there already.
  message GroupNew {
    string group = 1;
    optional Policy policy = 2;
  }

  // Replaces a group's policy whole.
  message GroupSet {
    string group = 1;
    Policy policy = 2;
  }

  // Adds and removes members, read as a post's `to` is read, so a pane is a name here too.
  message GroupMembers {
    string group = 1;
    repeated string add = 2;
    repeated string remove = 3;
  }

  // While paused, a group's posts are kept and wake nobody but the human.
  message Pause {
    string group = 1;
  }

  // Answered as a post is: each member with waking messages unread is woken once.
  message Resume {
    string group = 1;
  }

  // Deletes a group kept here, with its log, letting every member go; answered with Deleted.
  // Who may is the policy's `membership`, as for any other change (MIP-4, section 8).
  message GroupDelete {
    string group = 1;
  }

  // Answered once the caller has unread messages that would wake it: at once if it already
  // does. A newer wait for the same participant ends this one, refused as `superseded`.
  message Wait {
    optional string group = 1;
    // Refused as `timed_out` after this long. None waits for as long as the connection lasts.
    optional uint32 timeout_ms = 2;
    // Answered only with a wake the caller is due: once per batch, and once more "still
    // unread", as a ring would be. A Stop hook's wait, whose answer starts a turn; it marks
    // the caller as fetching with hooks.
    bool due = 3;
  }

  // From the app: the daemon of the machine it calls `name` is at `socket` on this machine,
  // forwarded over ssh. This daemon links to it for as long as this request's connection
  // lasts, dialing again whenever the link drops, so groups can span the two machines. It is
  // never answered while the connection lasts.
  message Peer {
    string name = 1;
    string socket = 2;
  }
}

message MsgAnswer {
  // The participant the daemon took the caller for.
  string caller = 1;
  // Why a refused request was refused, as data - `unread`, `name_in_use`, `timed_out` - where
  // the answer's reason says it in words, naming the command to run next.
  string refusal = 2;
  // Since 1.3. What to call the human where an answer shows it, as SetHumanName set it; empty
  // when nothing did.
  string human_name = 3;
  oneof answer {
    Joined joined = 10;
    Left left = 11;
    Posted posted = 12;
    Entries entries = 13;
    Members members = 14;
    Notices notices = 15;
    Changed changed = 16;
    // A resume, which wakes as a post does: `seq` is the notice it logged.
    Posted resumed = 17;
    Groups groups = 18;
    // Since 1.3.
    Deleted deleted = 19;
  }

  // A group deleted: how many entries its log held, and the members it let go, in this
  // machine's names.
  message Deleted {
    string group = 1;
    uint64 entries = 2;
    repeated string let_go = 3;
  }

  // A change to a group. No `seq` when it changed nothing: pausing a group already paused.
  message Changed {
    string group = 1;
    optional uint64 seq = 2;
    repeated string added = 3;
    repeated string removed = 4;
  }

  message Groups {
    repeated Group groups = 1;
  }

  message Group {
    string name = 1;
    repeated string members = 2;
    MsgRequest.Policy policy = 3;
  }

  message Joined {
    string name = 1;
    optional string group = 2;
    bool created = 3;
    // The name belonged to a participant that had gone, whose cursors this caller now has.
    bool took_over = 4;
  }

  message Left {
    repeated string groups = 1;
    bool stopped = 2;
  }

  message Posted {
    string group = 1;
    uint64 seq = 2;
    repeated Reached reached = 3;
  }

  message Reached {
    string name = 1;
    Reach reach = 2;
    // What its agent is doing, for an agent in a pane.
    Activity activity = 3;
    // For a deferred wake, what the doorbell waits for.
    Until until = 4;
  }

  // What a deferred wake waits for before its pane is rung.
  enum Until {
    UNTIL_UNSPECIFIED = 0;
    // Its agent to be idle: it is working, or blocked at a dialog.
    UNTIL_IDLE = 1;
    // Its prompt to be empty: something is typed there, or being typed, or the screen is not
    // its prompt, a menu say.
    UNTIL_PROMPT = 2;
    // An agent to be found in the pane, which was made moments ago.
    UNTIL_AGENT = 3;
    // Since 1.3. For an urgent post: its agent to be out of a dialog, working or idle.
    UNTIL_UNBLOCKED = 4;
  }

  enum Reach {
    REACH_UNSPECIFIED = 0;
    // Its inbox took a wake, or a wait it was in returned. Neither says the wake was read.
    REACH_WOKEN = 1;
    // Woken for this group already and not read since, so it will read this too.
    REACH_ALREADY_WOKEN = 2;
    // Nothing can wake it; it sees the message when it next reads.
    REACH_WAITING = 3;
    REACH_GONE = 4;
    // An agent in a pane that is busy, at a dialog or being typed into: it is rung there once
    // it is idle and nobody has typed into it for a few seconds.
    REACH_DEFERRED = 5;
    // In a pane with no agent in it, and none coming, and nothing else can wake it.
    REACH_NO_AGENT = 6;
    // In a pane whose agent's prompt the daemon cannot read, so the doorbell never rings it,
    // and nothing else can wake it.
    REACH_NO_DOORBELL = 7;
    // The group is paused: woken once it is resumed.
    REACH_PAUSED = 8;
    // On another machine, which could not be told.
    REACH_UNREACHABLE = 9;
  }

  // What an agent in a pane is doing, as detection reads the pane.
  enum Activity {
    // Not in a pane, or its agent's state is not known.
    ACTIVITY_UNSPECIFIED = 0;
    ACTIVITY_WORKING = 1;
    ACTIVITY_BLOCKED = 2;
    ACTIVITY_IDLE = 3;
    // Idle, having said it is waiting on work of its own.
    ACTIVITY_WAITING = 4;
  }

  // What `read` and `log` return, a group at a time.
  message Entries {
    repeated GroupEntries groups = 1;
  }

  message GroupEntries {
    string group = 1;
    repeated Entry entries = 2;
    // The machine the group is kept on, when this is a replica of it and that machine cannot
    // be reached now: what was posted there since may be missing.
    optional string behind = 3;
  }

  message Entry {
    uint64 seq = 1;
    // Milliseconds since the Unix epoch.
    uint64 at_ms = 2;
    oneof what {
      Message message = 10;
      // Who created the group, joined it or left it.
      string created = 11;
      string joined = 12;
      string left = 13;
      Changed changed = 14;
    }

    // Who changed the group itself, and how.
    message Changed {
      string by = 1;
      Change change = 2;
      // Since 1.3. The policy a set_policy set, so a replica taking several in one batch rings
      // each message under the one it was posted under. Absent from a daemon before 1.3, and for
      // an entry written before the log recorded it: the replica then reads it, as before, under
      // the policy the batch ends with.
      optional MsgRequest.Policy policy = 3;
    }

    enum Change {
      CHANGE_UNSPECIFIED = 0;
      CHANGE_SET_POLICY = 1;
      CHANGE_PAUSED = 2;
      CHANGE_RESUMED = 3;
    }
  }

  message Message {
    string author = 1;
    repeated string to = 2;
    string body = 3;
    // Since 1.3.
    bool urgent = 4;
  }

  message Members {
    repeated Member members = 1;
  }

  message Member {
    string name = 1;
    Liveness liveness = 2;
    repeated string groups = 3;
    optional string inbox = 4;
    Activity activity = 5;
    optional string pane = 6;
  }

  enum Liveness {
    LIVENESS_UNSPECIFIED = 0;
    LIVENESS_ALIVE = 1;
    LIVENESS_GONE = 2;
    // The human counts as alive whether or not anyone is at the window.
    LIVENESS_HUMAN = 3;
    // On another machine this one cannot reach now.
    LIVENESS_UNREACHABLE = 4;
  }

  // What `wait` returns: per group, the unread messages that would wake the caller.
  message Notices {
    repeated Notice notices = 1;
  }

  message Notice {
    string group = 1;
    uint64 first = 2;
    uint64 last = 3;
    uint64 count = 4;
    uint64 to_you = 5;
    repeated string from = 6;
    // Woken for these once already, and gone idle without reading them.
    bool again = 7;
    // Since 1.3. How many of them were posted urgently.
    uint64 urgent = 8;
    // Since 1.3. On a notice to the windows, whether the human is in the group: a group whose
    // count falls to 0 because the human read it is still theirs to list, and one they left or
    // that was deleted is not. A daemon that predates it leaves it false.
    bool member = 9;
  }
}

// ---------------------------------------------------------------------------------------------
// Control: what the daemon sends

message ControlMessage {
  oneof message {
    Answer answer = 1;
    Event event = 2;
    LogLine log_line = 3;
  }
}

// One record of the daemon's log, as the line its file holds: a JSON object, without the
// newline.
message LogLine {
  // Counting from 1 for this daemon run, with no gaps.
  uint64 number = 1;
  string line = 2;
}

message Answer {
  uint64 id = 1;
  Outcome outcome = 2;
  // Why, for anything but DONE and ALREADY_SO: written for whoever reads it in a log.
  string reason = 3;
  // The last event this request produced, or the latest event when it produced none.
  uint64 seq = 4;
  oneof detail {
    Snapshot snapshot = 10;
    PaneText text = 11;
    LogFollowed followed = 12;
    MsgAnswer msg = 13;
    Grids grids = 14;
  }
}

// Every pane's size, by the pane's name.
message Grids {
  map<string, Grid> panes = 1;
}

// What a FollowLog found. Records the client asked for that are older than `oldest` have left
// the daemon's memory, and are only in its file.
message LogFollowed {
  // The oldest record the daemon holds, which the replay started from unless `after` was later.
  uint64 oldest = 1;
  // The last record written before following began. The replay ends with it.
  uint64 newest = 2;
}

enum Outcome {
  OUTCOME_UNSPECIFIED = 0;
  OUTCOME_DONE = 1;
  // Nothing needed doing: the daemon was already as asked.
  OUTCOME_ALREADY_SO = 2;
  // The pane or tab the request names is not on this daemon.
  OUTCOME_NOT_THERE = 3;
  // Not done, for the reason given.
  OUTCOME_REFUSED = 4;
}

message Snapshot {
  // The sequence number this state is current to.
  uint64 seq = 1;
  uint64 instance = 2;
  repeated Tab tabs = 3;
  repeated Pane panes = 4;
  Settings settings = 5;
  // True while the daemon is bringing back the tabs a previous run saved: more arrive as
  // events, and `restored` says when it is done. A client that decides a tab is gone, or makes
  // a pane under a saved name, waits for that first.
  bool restoring = 6;
  // What waits for the human, per group with anything waiting: how a window that opens after
  // a message to the human is told of it.
  repeated MsgAnswer.Notice human = 7;
  // Since 1.3. This run brought panes back from the file a previous run wrote, so every process
  // in them was started by this run: a shell in each pane's directory, and the agents it resumes.
  // False for a run that took its panes over from a running daemon, or had nothing saved. Kept
  // for the whole run, so a client that connects after `restored` still learns it.
  bool restored_from_file = 8;
}

message PaneText {
  // The row of the first line in `text`. Since 1.3 rows are numbered from the start of the pane's
  // history, so a row keeps its number as rows above it are trimmed, until a change of width
  // rewraps them; before, from the oldest row the pane held. A read asked to start at a row
  // already trimmed starts at `oldest_row`.
  uint64 first_row = 1;
  // One line per row, joined by newlines.
  string text = 2;
  // The row after the last one the pane holds, so a reader knows where the end is: the rows it
  // holds in all, before 1.3, when nothing above them was counted.
  uint64 total_rows = 3;
  // Rows in this page, which can be fewer than were asked for: the next page starts at
  // `first_row + rows`.
  uint32 rows = 4;
  // Since 1.3. For a read of the turn, the row it starts at; `first_row` past it means the page
  // was cut short at its top.
  optional uint64 turn = 5;
  // Since 1.3. For a read of the turn, the pane's rows have moved since the turn began - rewrapped
  // to another width, or erased - so the turn may begin above `turn`. Rows trimmed off the top
  // move nothing: a turn that began in them has a `turn` before `oldest_row`.
  bool turn_moved = 6;
  // Since 1.3. The oldest row the pane still holds. Older daemons send 0, which was its number
  // then.
  uint64 oldest_row = 7;
}

message Event {
  uint64 seq = 1;
  oneof event {
    PaneOpened pane_opened = 10;
    PaneChanged pane_changed = 11;
    PaneClosed pane_closed = 12;
    TabOpened tab_opened = 13;
    TabChanged tab_changed = 14;
    TabClosed tab_closed = 15;
    SettingsChanged settings_changed = 16;
    PaneEffect pane_effect = 17;
    PasteHeld paste_held = 18;
    Restored restored = 19;
    Replaced replaced = 20;
    // What waits for the human in one group, sent whenever it changes: a message that wakes
    // the human, the human reading, or a policy that rings the human differently. A count of 0
    // means nothing waits there any more. A window takes it only from a daemon on its own
    // machine, the human's home (MIP-4, sections 10 and 11).
    MsgAnswer.Notice human_notice = 21;
  }
}

// This daemon has handed every pane to a new one, which serves the same socket, and is about
// to exit: the connection ends next. A client connects again and finds a new `instance`, so
// it starts again from a snapshot.
message Replaced {
  uint32 pid = 1;
  string daemon_version = 2;
}

// The daemon has finished bringing back what a previous run saved, sent only when it restored,
// and sent however restoring ended.
message Restored {
  // The saved tabs that did not come back: a name a client had already taken, or no pane in
  // it that a shell would start for.
  repeated string lost_tabs = 1;
  // The saved panes that did not come back, those of a lost tab among them. The file that held
  // what was lost is kept aside, and the daemon's log says where.
  repeated string lost_panes = 2;
  // True when this daemon writes nothing down for the rest of its run, and a restart brings
  // back what the file held when it started: restoring failed partway, or the file holding
  // what was lost could not be copied aside. The log says which.
  bool saving_stopped = 3;
}

message PaneOpened {
  Pane pane = 1;
}

// The pane's whole record as it is now.
message PaneChanged {
  Pane pane = 1;
}

message PaneClosed {
  string pane = 1;
  CloseReason reason = 2;
  // How its process ended, when it ended on its own and the daemon saw it end: its exit code,
  // or 128 plus the signal that ended it, as a shell reports it in $?.
  optional int32 exit_status = 3;
}

enum CloseReason {
  CLOSE_REASON_UNSPECIFIED = 0;
  // A client asked: a pane or tab close, or stop.
  CLOSE_REASON_REQUESTED = 1;
  // Its process ended.
  CLOSE_REASON_EXITED = 2;
}

message TabOpened {
  Tab tab = 1;
}

// The tab's whole record as it is now.
message TabChanged {
  Tab tab = 1;
}

message TabClosed {
  string tab = 1;
}

message SettingsChanged {
  Settings settings = 1;
}

// Something a program did that is not a change to its pane's record.
message PaneEffect {
  string pane = 1;
  oneof effect {
    Bell bell = 2;
    Notification notification = 3;
    Progress progress = 4;
    ClipboardWrite clipboard_write = 5;
  }

  message Bell {}

  // OSC 9 and OSC 777.
  message Notification {
    string title = 1;
    string body = 2;
  }

  // OSC 9;4.
  message Progress {
    ProgressState state = 1;
    optional uint32 percent = 2;
  }

  // OSC 52. The app decides whether to apply it.
  message ClipboardWrite {
    ClipboardKind clipboard = 1;
    string text = 2;
  }
}

enum ProgressState {
  PROGRESS_STATE_UNSPECIFIED = 0;
  PROGRESS_STATE_REMOVE = 1;
  PROGRESS_STATE_SET = 2;
  PROGRESS_STATE_ERROR = 3;
  PROGRESS_STATE_INDETERMINATE = 4;
  PROGRESS_STATE_PAUSE = 5;
}

enum ClipboardKind {
  CLIPBOARD_KIND_UNSPECIFIED = 0;
  CLIPBOARD_KIND_STANDARD = 1;
  CLIPBOARD_KIND_SELECTION = 2;
  CLIPBOARD_KIND_PRIMARY = 3;
}

// A paste with a newline, to a pane that has not asked for bracketed paste, was not written.
// The app asks the person whether to send it anyway, as Ghostty does.
message PasteHeld {
  string pane = 1;
  string text = 2;
}

// ---------------------------------------------------------------------------------------------
// Records

message Pane {
  string pane = 1;
  optional string label = 2;
  string cwd = 3;
  // What it was started with, if anything but a shell.
  optional string command = 4;
  string title = 5;
  // The agent detection recognised, by its manifest's name.
  optional string agent = 6;
  AgentState agent_state = 7;
  // What the agent has said about itself. Absent until it says anything, and cleared when
  // detection sees the pane's agent change or leave.
  AgentFacts facts = 8;
  // What the pane's program said with XTSHIFTESCAPE (CSI > Ps s): true to be sent shift-clicks,
  // false to leave them to the surface's selection. Absent while it has said nothing, when the
  // surface's own setting decides, as Ghostty's mouse-shift-capture does.
  optional bool shift_capture = 9;
  // The pane's agent finished something: it stopped working or waiting on you, by going idle or
  // by ending. Set whoever was looking, since the daemon cannot see a window; a window that
  // shows the pane with the keyboard clears it with `PaneRequest.Seen`, and so does the agent
  // working or waiting on you again. A view shows it as done.
  // Kept for as long as the daemon runs and across a handoff, and never written to the state
  // file: a restored pane has no agent to have finished anything.
  bool finished_unseen = 10;
  // `agent_state` is what the agent reported of itself rather than detection's reading.
  bool state_reported = 11;
  // Detection's rules have stopped reading this agent's screen: it keeps changing while no rule
  // reads it, or they read idle while the agent reports working. A harness update that changed
  // its screen is the usual cause; the pane's state then comes only from the agent's reports.
  bool screen_unreadable = 12;
  // Since 1.3. The pane's agent can be compacted (`PaneRequest.Compact`): its manifest, as this
  // daemon holds it, says how. False for a pane running no agent. A view offers compacting on
  // this rather than reading a manifest of its own, which may not be the one this daemon types.
  bool agent_compacts = 13;
  // Whether the pane's agent reports itself, through its harness's adapter. Unsaid until the
  // agent reports or ends a turn without having reported, and again when the agent changes or
  // leaves. Since 1.3.
  Adapter adapter = 14;
}

// Whether a pane's agent reports itself (`PaneRequest.Report`).
enum Adapter {
  // Nothing to say yet: no agent, or one that has not yet ended a turn. A harness that reports
  // only once it is prompted, as Codex does, has not had the chance.
  ADAPTER_UNSAID = 0;
  // The agent has reported since it came into the pane.
  ADAPTER_REPORTING = 1;
  // The agent ended a turn and had reported nothing: its harness has no adapter installed, or
  // one that is not running.
  ADAPTER_SILENT = 2;
}

// Facts an agent reports about itself (`PaneRequest.Report`), for a view to render beside its
// state.
message AgentFacts {
  // How much of the agent's context window is in use, from 0 to 100.
  optional float context_used = 1;
  // Sub-agents running now.
  uint32 subagents = 2;
  // The model, as the agent names it for a person: "Opus 4.5". At most 128 bytes.
  optional string model = 3;
  // What the session has cost so far, in US dollars. Not negative.
  optional double cost_usd = 4;
  // Anything else, passed through: at most 16 keys, each 1 to 64 bytes, each value at most 256
  // bytes, with no control characters in either.
  map<string, string> other = 5;
  // What the agent says it is waiting on, having ended its turn to wait for work it started: "the
  // full gate". At most 256 bytes. The daemon clears it when a later turn of the agent's ends
  // without the agent declaring it again, and sets no finished_unseen while it holds: an agent
  // waiting on its own work has not finished.
  optional string waiting = 6;
}

enum AgentState {
  AGENT_STATE_UNKNOWN = 0;
  AGENT_STATE_WORKING = 1;
  AGENT_STATE_BLOCKED = 2;
  AGENT_STATE_IDLE = 3;
}

message Tab {
  string tab = 1;
  Label label = 2;
  Node root = 3;
  optional string zoomed = 4;
}

// A tab's name, as a person gave it. Every daemon holding part of a grouped tab stores it, and
// the generation says which of them is newest.
message Label {
  optional string text = 1;
  uint64 generation = 2;
}

message Node {
  oneof node {
    string pane = 1;
    Split split = 2;
  }
}

message Split {
  Axis axis = 1;
  // The first child's share of the area.
  float ratio = 2;
  Node first = 3;
  Node second = 4;
}

enum Axis {
  AXIS_UNSPECIFIED = 0;
  // Children side by side; `first` is the left one.
  AXIS_COLUMNS = 1;
  // Children one above the other; `first` is the upper one.
  AXIS_ROWS = 2;
}

enum Branch {
  BRANCH_UNSPECIFIED = 0;
  BRANCH_FIRST = 1;
  BRANCH_SECOND = 2;
}

enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_LEFT = 1;
  SIDE_RIGHT = 2;
  SIDE_UP = 3;
  SIDE_DOWN = 4;
}

// A pane's size: cells, and the pixels those cells cover.
message Grid {
  uint32 cols = 1;
  uint32 rows = 2;
  uint32 width_px = 3;
  uint32 height_px = 4;
}

message Settings {
  Shell shell = 1;
  optional uint64 scrollback_bytes = 2;
  optional Palette palette = 3;
  // Absent: allowed.
  optional bool clipboard_write = 4;
  // Absent: none sent, which the daemon treats as nothing named.
  optional Cursor cursor = 5;
  // Absent: 1.
  optional double scroll_multiplier = 6;
  // Since 1.3. Absent: named.
  optional bool name_sessions = 7;
  // Since 1.3. Absent: the human is shown by the address alone.
  optional string human_name = 8;
  // Since 1.3. Absent: no agent is compacted unasked.
  optional float compact_at = 9;
  // Since 1.3. Absent: agents are resumed.
  optional bool resume_agents = 10;
}

// ---------------------------------------------------------------------------------------------
// Input: client to daemon, never answered

// A keystroke, click or paste for one pane. The daemon encodes it against the pane's own
// terminal modes and is the only writer to the pane's PTY.
message InputEvent {
  string pane = 1;
  oneof input {
    Key key = 2;
    Mouse mouse = 3;
    Wheel wheel = 4;
    Paste paste = 5;
    Send send = 6;
    Focus focus = 7;
    Perform perform = 8;
  }

  // The event libghostty carries for a key.
  message Key {
    KeyAction action = 1;
    // libghostty's key code.
    uint32 key = 2;
    // libghostty's modifier bits.
    uint32 mods = 3;
    uint32 consumed_mods = 4;
    string text = 5;
    uint32 unshifted_codepoint = 6;
    bool composing = 7;
    // The app's setting, which the core has already applied to the modifiers and text; the
    // encoder is told it too, so the two steps cannot disagree.
    OptionAsAlt option_as_alt = 8;
  }

  // Position in pixels within the pane.
  message Mouse {
    MouseAction action = 1;
    MouseButton button = 2;
    uint32 mods = 3;
    double x = 4;
    double y = 5;
  }

  message Wheel {
    double dx = 1;
    double dy = 2;
    bool precise = 3;
    uint32 momentum = 4;
    uint32 mods = 5;
    double x = 6;
    double y = 7;
  }

  // Fenced for bracketed paste when the pane asked for it; held (PasteHeld) when it did not and
  // the text has a newline.
  message Paste {
    string text = 1;
    // The person agreed to paste text that was held, so it is written although unsafe.
    bool confirmed = 2;
  }

  // `muster pane send`: the text as a paste, fenced when the pane asked for bracketed paste but
  // never held, since a program or agent is speaking rather than a clipboard; then Return, if
  // asked, encoded as the key against the pane's modes.
  message Send {
    string text = 1;
    bool enter = 2;
  }

  // Focus in or out, reported to a program that asked (mode 1004).
  message Focus {
    bool focused = 1;
  }

  // One of the binding actions the daemon performs rather than the surface.
  message Perform {
    oneof action {
      ClearScreen clear_screen = 1;
      Reset reset = 2;
      // Bytes a person typed that need no encoding: `text:`, `csi:` and `esc:` bindings, already
      // resolved, and text an input method committed.
      bytes raw = 3;
    }
    // Was the key's own bytes, which only the daemon can encode, since they depend on the pane's
    // keyboard modes.
    reserved 4;
    // The key whose binding asked for this, which the daemon encodes against the pane's modes and
    // sends the program when it does not act: clear_screen on the alternate screen, where Ghostty
    // leaves the key to the program. Absent for an action no key asked for.
    Key key = 5;

    message ClearScreen {}
    message Reset {}
  }
}

enum OptionAsAlt {
  // Never.
  OPTION_AS_ALT_UNSPECIFIED = 0;
  OPTION_AS_ALT_NEVER = 1;
  OPTION_AS_ALT_ALWAYS = 2;
  OPTION_AS_ALT_LEFT = 3;
  OPTION_AS_ALT_RIGHT = 4;
}

enum KeyAction {
  KEY_ACTION_UNSPECIFIED = 0;
  KEY_ACTION_PRESS = 1;
  KEY_ACTION_RELEASE = 2;
  KEY_ACTION_REPEAT = 3;
}

enum MouseAction {
  MOUSE_ACTION_UNSPECIFIED = 0;
  MOUSE_ACTION_PRESS = 1;
  MOUSE_ACTION_RELEASE = 2;
  MOUSE_ACTION_MOTION = 3;
}

enum MouseButton {
  MOUSE_BUTTON_UNSPECIFIED = 0;
  MOUSE_BUTTON_NONE = 1;
  MOUSE_BUTTON_LEFT = 2;
  MOUSE_BUTTON_RIGHT = 3;
  MOUSE_BUTTON_MIDDLE = 4;
}

// ---------------------------------------------------------------------------------------------
// Stream: one pane's bytes, for one bridge

message StreamRequest {
  oneof request {
    // The first message after the handshake.
    Attach attach = 1;
    Credit credit = 2;
    Resize resize = 3;
  }

  message Attach {
    string pane = 1;
    Grid grid = 2;
    // Displace a bridge already attached, which is told why. Without it a second attach is
    // refused.
    bool takeover = 3;
    // How much output the bridge may have unacknowledged, in bytes. Absent or 0 is the
    // daemon's default, 256 KiB, which suits a bridge on the daemon's machine. The pane's
    // program is held to about one window per round trip, so a bridge reaching the daemon over
    // ssh asks for 2 MiB, ssh's own channel window (MIP-3 section 4). The daemon keeps it
    // between 64 KiB and 4 MiB.
    optional uint64 window = 4;
  }

  // Bytes of `output` written to the surface since the last credit; a replay's bytes are not
  // counted. The daemon sends output while less than a window of it is unacknowledged, so a
  // bridge must credit what it has written before a window's worth waits on it. A bridge that
  // falls behind is caught up once half its window is free, so it must credit in batches of at
  // most half the window: one that batches more can be left behind for good, holding less
  // than a batch it will never complete.
  message Credit {
    uint64 bytes = 1;
  }

  message Resize {
    Grid grid = 1;
  }
}

message StreamMessage {
  oneof message {
    Attached attached = 1;
    StreamRefused refused = 2;
    // The composed VT stream bringing the surface to the pane's state. Live output follows. After
    // an attach it brings a fresh surface there, history included; after `behind`, it brings the
    // surface's screen there and keeps the history the surface already holds.
    bytes replay = 3;
    // The program's own bytes.
    bytes output = 4;
    // The window of unacknowledged output is full and output is being skipped. Once credit
    // frees half the window, a replay catches the surface up with the screen, not the history
    // it missed, and output resumes.
    Behind behind = 5;
    Detached detached = 6;
  }

  message Attached {
    // The pane's output offset the replay is current to.
    uint64 offset = 1;
  }

  message Behind {}

  message Detached {
    DetachReason reason = 1;
  }
}

message StreamRefused {
  string reason = 1;
  AttachRefusal kind = 2;
}

// Which refusal it was, so that a bridge can tell a pane that is gone from an attach worth
// trying again without reading the reason's prose.
enum AttachRefusal {
  ATTACH_REFUSAL_UNSPECIFIED = 0;
  // The daemon holds no pane by that name.
  ATTACH_REFUSAL_NO_PANE = 1;
  // The pane is closing.
  ATTACH_REFUSAL_PANE_CLOSED = 2;
  // Another bridge is drawing the pane, and this one did not ask to take it over.
  ATTACH_REFUSAL_ATTACHED_ELSEWHERE = 3;
  // The grid is not one a terminal can have, such as zero cells.
  ATTACH_REFUSAL_BAD_GRID = 4;
  // The stream's first message did not read, or was not an attach.
  ATTACH_REFUSAL_MALFORMED = 5;
  // The daemon could not hold the stream, for want of a descriptor or a thread.
  ATTACH_REFUSAL_UNAVAILABLE = 6;
}

enum DetachReason {
  DETACH_REASON_UNSPECIFIED = 0;
  DETACH_REASON_CLOSED = 1;
  DETACH_REASON_EXITED = 2;
  DETACH_REASON_TAKEN_OVER = 3;
  // The daemon has handed the pane to a new daemon on the same socket: attach there.
  DETACH_REASON_REPLACED = 4;
}

// ---------------------------------------------------------------------------------------------
// Handoff: from a daemon to the daemon replacing it (MIP-3 section 10)
//
// Never on the daemon's socket. The old daemon starts the new one with one end of a socket pair
// as the descriptor `--handoff` names, and they speak Handoff frames over it, framed as every
// connection is. A frame that brings descriptors follows a single byte that carries them as
// SCM_RIGHTS. In order: Offer; Accept or Refused; Session, bringing the listening socket and
// the lock file; for each pane, Pane bringing its PTY master, then its replay in replay_piece
// frames; Ready; Commit; Serving. Until Serving the old daemon keeps its own copy of every
// descriptor, so a new daemon that fails at any point takes no pane with it.
message Handoff {
  oneof message {
    Offer offer = 1;
    Accept accept = 2;
    Refused refused = 3;
    Session session = 4;
    Pane pane = 5;
    bytes replay_piece = 6;
    Ready ready = 7;
    Commit commit = 8;
    Serving serving = 9;
  }

  message Offer {
    Version protocol = 1;
    string daemon_version = 2;
    uint32 pid = 3;
    uint32 panes = 4;
  }

  message Accept {
    Version protocol = 1;
    string daemon_version = 2;
  }

  message Refused {
    string reason = 1;
  }

  message Session {
    // What a restart would bring back, as the state file holds it: the new daemon reads it with
    // the same rules, and refuses one newer than it reads.
    bytes state = 1;
    // What the app last sent (SendManifests).
    repeated Manifest app_manifests = 2;
    // The daemon handing over writes nothing to the state file: it is a newer daemon's, one it
    // could not read or move aside, or one whose unrestored tabs it could not keep a copy of. The
    // new daemon writes nothing to it either.
    bool saving_stopped = 3;
  }

  message Pane {
    // Everything the protocol says about the pane. Its tab, label and directory are in
    // Session's state too.
    .muster.daemon.Pane record = 1;
    Grid grid = 2;
    // The pane's process, which is the old daemon's child and never the new one's.
    optional int32 process = 3;
    // How many bytes of replay follow, in replay_piece frames.
    uint64 replay_length = 4;
    // Where the pane's agent detection stood, so the new daemon goes on from there rather than
    // recognizing the agent anew. Absent from a daemon that sends none: detection starts over.
    Detection detection = 5;
    // Whether the agent declared the wait it holds since its last turn ended, which keeps the wait
    // past the end of the turn it was declared in. Absent from a daemon that sends none: taken as
    // declared, so a wait lasts a turn too long rather than too short.
    optional bool wait_declared = 6;
    // Whether the agent reports its own state, so that its own idle report ends its turns rather
    // than the screen.
    bool reports_turns = 7;
    // Since 1.3. The session id the pane's agent reported (Report.session_id), which its hooks
    // say only as a session starts, so the new daemon could not learn it again for the life of
    // the session. Absent: none reported.
    optional string session_id = 8;
    // Since 1.3. The number of the oldest row the pane holds, which the replay begins with, so
    // the new daemon goes on numbering rows from the start of the pane's history.
    uint64 oldest_row = 9;
  }

  // One pane's agent detection, as `muster-detect`'s detector holds it. Times are carried as
  // durations, since an instant means nothing in another process.
  message Detection {
    // The agent the pane runs, by manifest name, and how many probes in a row have missed it.
    optional string agent = 1;
    uint32 misses = 2;
    // The state detection last decided, and whether the agent drew it.
    AgentState state = 3;
    bool visible = 4;
    // What was last published, if anything.
    bool emitted = 5;
    optional string emitted_agent = 6;
    AgentState emitted_state = 7;
    // What is left of the grace a newly recognized agent gets.
    optional uint32 grace_left_ms = 8;
    // An idle not yet believed: how long ago it was first seen, and how often since.
    optional uint32 idle_seen_ms_ago = 9;
    uint32 idle_confirmations = 10;
    optional uint32 foreground_group = 11;
    bool probed = 12;
    bool shell_clear_pending = 13;
    bool shell_exit_reported = 14;
    // The agent changed and its title reads empty until the next title write.
    bool title_pending = 15;
    // The last OSC 9 payload.
    string progress = 16;
    // What the screen rules last concluded, which can differ from what was published while an
    // agent's own report outranks it.
    bool concluded = 17;
    optional string concluded_agent = 18;
    AgentState concluded_state = 19;
    // The agent's own report, while it counts, and how long ago it came.
    optional string report_agent = 20;
    AgentState report_state = 21;
    uint32 report_ms_ago = 22;
    // How long ago the pane last produced output, which a working report goes stale from.
    optional uint32 output_ms_ago = 23;
    // Whether what was last published was a report, and said the screen was unreadable.
    bool emitted_reported = 24;
    bool emitted_unreadable = 25;
    // Where telling that the rules cannot read the screen stands: how long ago the rules began
    // reading every screen as idle, no rule began matching, and a working report began counting,
    // and how long ago each second of the last minute with output began.
    optional uint32 rules_idle_ms_ago = 26;
    optional uint32 unmatched_ms_ago = 27;
    optional uint32 working_ms_ago = 28;
    repeated uint32 active_ms_ago = 29;
    // Whether the rules had read the report's state since it came: one they had lets go once
    // they read something else, where one they never read waits for the screen to move.
    bool report_confirmed = 30;
    // How long ago the rules began reading every screen as a prompt they can see, which sets a
    // working report aside.
    optional uint32 blocker_ms_ago = 31;
  }

  message Ready {}
  message Commit {}
  message Serving {}
}

// ---------------------------------------------------------------------------------------------
// Peer: one daemon to another (MIP-4, section 11)
//
// A group is kept on one daemon, its home, which numbers and stores its log. A daemon with a
// member of a group kept elsewhere holds a replica, forwards its members' joins, leaves and
// posts to the home, and wakes only its own members. The daemon that dials sends Introduce
// first and the one dialed answers with its own; after that either sends calls and replies,
// matched by id, in any order.
//
// Each daemon writes its own members bare and another machine's as `name@machine`, in its own
// name for that machine. Every name in a frame is written as its sender writes it; the receiver
// turns it into its own. Groups are named as their home names them.

message PeerFrame {
  oneof frame {
    Introduce introduce = 1;
    PeerCall call = 2;
    PeerReply reply = 3;
    // Since 1.2.
    Cancel cancel = 4;
  }
}

// The call `id` is no longer wanted: a carried wait whose caller hung up. The machine asked ends
// it, and may reply to it or not.
message Cancel {
  uint64 id = 1;
}

message Introduce {
  // What the sender calls itself: its host name.
  string name = 1;
  // What the sender calls the receiver. The dialer's comes from the app; the one dialed says
  // the name it was introduced by.
  string you = 2;
}

message PeerCall {
  uint64 id = 1;
  oneof call {
    Find find = 10;
    Join join = 11;
    Leave leave = 12;
    Post post = 13;
    Since since = 14;
    Who who = 15;
    // From a group's home: its new entries, for the replica to take and wake its members for.
    Caught replicate = 16;
    // Since 1.2.
    Whom whom = 17;
    // A request the person made on the asking machine, done here as the human, who is homed on
    // this one (MIP-4, section 10). Its names are written as the asker writes them; its answer
    // is in this machine's.
    MsgRequest carried = 18;
    // Since 1.3. From a group's home: the group is deleted, so the replica goes, and with it
    // what its members here had read and been woken for. Answered with `applied`.
    Forget forget = 19;
  }

  message Forget {
    string group = 1;
  }

  // Whether a group by this name is kept there.
  message Find {
    string group = 1;
  }

  // `head` is how far the asker's replica reaches, so the reply can carry what it lacks.
  message Join {
    string name = 1;
    string group = 2;
    uint64 head = 3;
  }

  message Leave {
    string name = 1;
    string group = 2;
    uint64 head = 3;
  }

  // `cursor` is how far the author had read, which the home's guard counts unread from.
  message Post {
    string author = 1;
    string group = 2;
    repeated string to = 3;
    string body = 4;
    uint64 cursor = 5;
    uint64 head = 6;
    // Since 1.3.
    bool urgent = 7;
  }

  message Since {
    string group = 1;
    uint64 after = 2;
  }

  // The asked daemon's own members of the group, and what each is doing.
  message Who {
    string group = 1;
  }

  // The participant a name means on the asked machine, for an asker that has nobody by it.
  message Whom {
    string name = 1;
  }
}

message PeerReply {
  uint64 id = 1;
  oneof reply {
    bool found = 10;
    Joined joined = 11;
    Caught left = 12;
    Posted posted = 13;
    Caught caught = 14;
    MsgAnswer.Members members = 15;
    Refused refused = 16;
    // What a replicate did: whom it reached on the replica's machine.
    Reached applied = 17;
    // Since 1.2.
    Named named = 18;
    Carried carried = 19;
  }

  // Who a `whom` names, if anybody.
  message Named {
    optional string name = 1;
  }

  // What a carried request came to, as this machine answers the request when it is made here.
  message Carried {
    bool refused = 1;
    string reason = 2;
    MsgAnswer answer = 3;
  }


  message Joined {
    // The number of the entry saying the asker's member joined.
    uint64 seq = 1;
    Caught caught = 2;
  }

  message Posted {
    uint64 seq = 1;
    repeated MsgAnswer.Reached reached = 2;
    Caught caught = 3;
  }

  message Reached {
    repeated MsgAnswer.Reached reached = 1;
  }

  // A refusal, as fields the asker renders in its own words and names. `code` is the one
  // `MsgAnswer.refusal` carries; `words` are the sender's, for a code the asker does not know.
  message Refused {
    string code = 1;
    string words = 2;
    string name = 3;
    string group = 4;
    string machine = 5;
    uint64 count = 6;
    string existing = 7;
    repeated string candidates = 8;
    Caught caught = 9;
    // What a group's policy refused: `join`, `leave`, `add`, `remove`, `set_policy`, `pause`
    // or `resume`.
    string action = 10;
  }
}

// A group's entries after some point, and the policy they are read under.
message Caught {
  string group = 1;
  repeated MsgAnswer.Entry entries = 2;
  MsgRequest.Policy policy = 3;
  // The home holds entries after these, sent a page at a time so that a frame stays under the
  // ceiling: ask `Since` again from the new head.
  bool more = 4;
}
