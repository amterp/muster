// Muster's vocabulary, and the only thing that crosses the shell/core seam.
//
// Generated on both sides from this file and never committed, so a shell and a core that
// disagree is not a state the repo can be in (see ./dev --proto). The same schema is meant
// to serve the CLI and the agent-facing API, which is what turns "every action runs
// through one shared path" from a discipline into codegen (mip/0001-portable-core.md).
//
// Field numbers are not yet a compatibility promise: today both sides are generated from
// this file in the same build, so nothing outlives a renumbering. That changes the day a
// CLI speaks this over a socket to a different build, and this comment should change with
// it.

syntax = "proto3";

package muster;

// Everything the shell asks of the core.
message Request {
  oneof payload {
    Startup startup = 1;
    LogRecord log_record = 2;
    AttachPane attach_pane = 3;
    KeyDown key_down = 4;
    KeyUp key_up = 5;
    SendText send_text = 6;
    Paste paste = 7;
    Scroll scroll = 8;
    SplitPane split_pane = 9;
    ClosePane close_pane = 10;
    FocusPane focus_pane = 11;
    SetSplitRatio set_split_ratio = 12;
    FocusRelative focus_relative = 13;
    WindowFocus window_focus = 14;
    SetRegionBoundary set_region_boundary = 15;
    OpenWindow open_window = 16;
    CreateTab create_tab = 17;
    BridgeExited bridge_exited = 18;
    ResizePane resize_pane = 19;
    ZoomPane zoom_pane = 20;
    ReadBindings read_bindings = 21;
    ToggleSidebar toggle_sidebar = 22;
    FocusTabRelative focus_tab_relative = 23;
    FocusPaneAt focus_pane_at = 24;
    ReadAppearance read_appearance = 25;
    AdjustFontSize adjust_font_size = 26;
    ReloadConfig reload_config = 27;
    RenamePane rename_pane = 28;
    RenameTab rename_tab = 29;
    FocusTab focus_tab = 30;
    ArrangePane arrange_pane = 31;
    Find find = 32;
    FindStep find_step = 33;
    EndFind end_find = 34;
    ReadWindow read_window = 35;
    SendToPane send_to_pane = 36;
    ReadWindowFrame read_window_frame = 37;
    SetWindowFrame set_window_frame = 38;
    ReportFontFamily report_font_family = 39;
    Quitting quitting = 40;
  }
}

// This process is going away, and its panes should be handed back.
//
// The one thing the core cannot see for itself. A dylib does not get to notice its host
// terminating, and everything the core would want to do about it has to happen before the
// window's bridges are killed - so the shell says, synchronously, and the core answers when
// it has finished.
//
// What it does is put each pane's grid back. A backend holds a pane's terminal at whatever
// size the last controlling client set and does not release it, so a Muster that quits leaves
// every pane it touched sized to a window that no longer exists and whoever picks the session
// up next inherits that (`observations/herdr-0.8.0.md` section 4). "Sessions outlive the app"
// is the promise this protects: a rough Muster should never cost a workday, and handing back
// mis-sized panes costs one.
//
// Muster's own, until the backend does it. This is a defect upstream rather than a design, and
// the day it releases the hold itself is the day this becomes a no-op rather than a second
// answer.
//
// Nothing is published in reply. The window is closing; a view it would repaint has nowhere to
// go, and a shell waiting on this is waiting to exit.
message Quitting {}

// What this machine had to say about the font family the config named.
//
// The one appearance value that cannot fail loudly on its own. A renderer takes a family name
// as a string rather than as a choice from a list, so it accepts anything, falls back and
// paints - which makes a typo, a font installed for another user, and a correct name on a
// machine that has the font look identical. So the shell looks it up and reports, and the core
// decides whether that is worth telling anybody and in what words.
//
// About the one family rather than a list of everything installed, because enumerating them
// costs a tenth of a second on a launch and nothing in the core needs to know what else is
// there.
//
// Sent at launch and again whenever the config file is read, so a corrected family clears the
// problem the way a corrected config does.
message ReportFontFamily {
  // What `[font] family` asked for, empty when it named none. Echoed back so the core can drop
  // an answer about a family it no longer asks for: two saves in quick succession can leave a
  // lookup in flight against the older one.
  string family = 1;

  // Whether the platform has a family by that name. Resolved rather than compared, so a name
  // written in another case is found the way the renderer would find it.
  bool found = 2;

  // Whether that family is monospaced. Meaningless when `found` is false - there is no font to
  // have the trait - and the core is careful not to read it as a proportional font.
  bool monospaced = 3;
}

// A rectangle, in whatever coordinates the platform draws windows in.
//
// No units and no display. Muster does not convert these or compare them to anything it knows;
// they go out the way they came in, so what a point is remains the shell's business.
message WindowRect {
  double x = 1;
  double y = 2;
  double width = 3;
  double height = 4;
}

// How big a window is, and whether it is in the platform's own full-screen.
//
// Together because the shell only ever knows both at once: while a window is full-screen, the
// rectangle it reports is the one it will come back out to. Sending either alone would invite a
// half-written pair.
message WindowFrame {
  // Absent for a window that has never settled anywhere - a first launch, a state file written
  // before this existed, or one hand-edited into a rectangle with no size. All three mean the
  // same thing to a shell: open the window wherever you would have.
  optional WindowRect rect = 1;

  bool full_screen = 2;
}

// Asks where this window should open, given the screens this machine has.
//
// Asked at launch, before the window is on screen, for the reason ReadAppearance is: an event
// reaches a shell a run-loop turn later, which is a window that visibly jumps from the middle of
// the display to where it was left. So this is a question, and there is no matching event -
// nothing in the core ever needs to move a window, because only a shell can.
//
// The screens are the argument because only a shell can ask the platform for them, and the
// answer is the core's because a rule nobody can reach from a test is a rule that drifts. The
// rectangle that comes back is already fitted to what was reported: a window saved on a desk
// monitor and reopened on a laptop is brought back somewhere its title bar can be grabbed.
//
// An empty list is a shell that could not enumerate displays rather than a machine with none,
// and the core answers by fitting nothing - moving somebody's window on the strength of a
// reporting failure would turn a bug here into a lost arrangement.
message ReadWindowFrame {
  repeated WindowRect screens = 1;
}

// Says where the window has settled, so the next launch can put it back.
//
// One direction only, and this is it. Sent when a window is moved, resized, or enters or leaves
// full-screen - and once at launch, so the core holds where the window actually opened rather
// than where it wished to.
//
// The rectangle is always the one the window has when it is *not* full-screen. On macOS a
// full-screen window reports the whole display as its frame, and writing that down would leave
// somebody who leaves full-screen with a window the size of their monitor and no way back.
//
// A drag produces one of these per frame of animation, which is why the shell coalesces them:
// see `LatestRequestSender`. Nothing here is answered with anything but Ok.
message SetWindowFrame {
  WindowFrame frame = 1;
}

// Asks what this window is showing, and what it holds that it is not showing.
//
// Every other read here answers a question about configuration. This one answers a question
// about state, and it exists because a caller that is not the shell has no events: the shell
// is told when the view changes and builds a picture from the stream, while a script runs for
// one command and has to be able to ask. An agent has no eyes at all, so without this it can
// act on the window and never learn what it did.
//
// Answered from the same builders the events come from, so there is one account of what a
// window is rather than a read that can disagree with what is on screen.
message ReadWindow {}

// Looks for text in a pane, and puts the first match on screen.
//
// Sent per keystroke in the find bar, so the needle is the whole request rather than
// something built up: what is being asked is always "find this", never "find this as well".
//
// **What it searches is a pane's recent history, not what is on screen.** A surface is
// repainted from a frame stream and keeps no scrollback, so the renderer's own find would
// cover one screen. The daemon holds the history and answers at most a thousand rows of it,
// which is why the answer says how far it reached (`observations/herdr-0.8.0.md` section 17).
message Find {
  string daemon_id = 1;

  // Empty means the pane this window's keyboard is on, as everywhere else. A find bar is
  // drawn over that pane, so empty is the ordinary case here rather than a shorthand.
  string pane_id = 2;

  // Plain text. Matched as a substring with ASCII case folding and nothing else, because
  // that is what the renderer highlighting these does, and two matchers that disagreed would
  // put a count over a screen contradicting it.
  string needle = 3;
}

// Goes to the next match, or the previous one, and puts it on screen.
//
// Names no pane, unlike every other request here: there is one search at a time, and which
// pane it is about was settled when somebody typed into the bar. Naming one again would
// invite a step against a pane the search is not about.
message FindStep {
  // `next` or `previous`. Next climbs the pane, because the first match is the newest one
  // and the ones before it are further up - which is also why the bar draws next as an
  // upward chevron.
  string direction = 1;
}

// Forgets the search, which is what closing the find bar means.
message EndFind {}

// Calls a pane what somebody wants to call it.
//
// A person running fifteen agents wants to say which is which in their own words. The name is
// the daemon's to keep rather than Muster's to remember: any client can set one and it comes
// back after a daemon restart, so a name held up here would be invisible to every other client
// and lost on a restart.
message RenamePane {
  string daemon_id = 1;

  // Empty means the pane the keyboard is on, which is what a chord and a menu item mean.
  string pane_id = 2;

  // Empty takes the name away, leaving the pane called after its directory again. Empty rather
  // than an absent field because a name nobody could have typed - the empty one - is not a
  // state worth being able to ask for, and one spelling for "no name" is fewer than two.
  string name = 3;
}

// Calls a tab what somebody wants to call it.
//
// Separate from RenamePane rather than one verb over a target, because the two are not the
// same operation underneath: a tab rename is announced to every client and a pane rename is
// announced to none, and only a pane's can be fully undone.
message RenameTab {
  // Empty finds the daemon from the tab, which is what a caller naming only a tab means. Only
  // read when no tab is named, where it decides whose keyboard's tab this is about.
  string daemon_id = 1;

  // What Muster calls the tab - `t1w3r07bsd` - minted by Muster and unique across every attached
  // machine, so it is an answer on its own (crates/muster-core/src/names.rs).
  //
  // Empty means the tab the keyboard's pane is in.
  string tab_id = 2;

  // Empty asks for the name to be taken away. How completely that happens is the backend's
  // answer rather than a promise made here: herdr leaves such a tab nameless rather than
  // restoring its number, and Muster's own caption then draws the place.
  string name = 3;
}

// Asks which chord means what.
//
// The shell builds its menu from the answer rather than from a table of its own, so a config
// file that rebinds an action rebinds the menu item too - and on macOS that is the whole of
// rebinding, because a key equivalent on a menu item is how the platform decides what a chord
// means. Nothing is dispatched through here: what a shell does with a chord is the shell's,
// and what a chord is called is Muster's.
message ReadBindings {}

// Asks what Muster should look like.
//
// Both halves of it, and deliberately one message: the cells inside a pane are painted by the
// renderer and the line between two regions is painted by the shell itself, but which piece of
// code holds the brush is not something a person picking colours should have to know. The shell
// splits this answer; the core does not.
//
// Asked at launch, when the renderer is being built and no event loop is running yet. It can
// change after that, and when it does the core sends AppearanceChanged - so the two exist for
// the two moments rather than one being redundant.
message ReadAppearance {}

// What Muster should look like.
//
// Every field may be absent, and absent means the renderer's own default rather than one Muster
// invented - what this vocabulary is for is naming what a person may change. A replacement
// renderer supplies the rest, which is a stated limit of the contract rather than a gap in it.
// Colours are `#rrggbb`, and empty is how a string field says nothing was named.
message Appearance {
  // A font family as the system knows it. Empty leaves the choice to the renderer, which is a
  // question about the machine rather than about Muster: a family nobody installed is worse
  // than no answer.
  string font_family = 1;
  // In points. Zero means none was named.
  float font_size = 2;

  string background = 3;
  string foreground = 4;
  string cursor = 5;
  // What a character under the cursor is painted in.
  string cursor_text = 6;
  string selection_background = 7;
  string selection_foreground = 8;

  // The sixteen ANSI colours, black through bright white, or none of them. Never a partial
  // list: the core refuses one, because a few entries of somebody's theme over the rest of the
  // renderer's is a scheme nobody designed.
  repeated string palette = 9;

  // block, bar, underline or hollow. Empty means none was named.
  string cursor_style = 10;
  // Absent leaves it to the program in the pane, which can ask for either and often does.
  optional bool cursor_blink = 11;

  // Blank space between a pane's text and its edges, in points. Absent rather than zero when
  // none was named, because zero is a real answer - it is what fits the most rows.
  optional uint32 pane_padding = 12;

  // The line between two regions. The one colour here no renderer paints: everything else is
  // inside a pane, and this is Muster's own chrome. Empty means the shell's own platform
  // default, which only the shell knows and which a colour invented in the core would be one
  // more thing to keep in step with a system theme.
  string divider_color = 13;
}

// Grows a pane against its neighbour, by a step.
//
// What a chord held down means: this pane bigger, in that direction. Unlike SetSplitRatio,
// which names a divider by the turns down to it and says where it should sit, nothing here
// mentions a divider - which one moves is a question about a tree the person pressing the key
// is not looking at, and only the daemon holds the rectangles that answer it.
message ResizePane {
  string daemon_id = 1;
  string pane_id = 2;

  // left, right, up or down.
  string direction = 3;

  // What fraction of the region to move the divider by, between 0 and 1. Zero means the
  // daemon's own step, which is what a keybinding wants; a CLI or an agent placing a divider
  // exactly says.
  float amount = 4;

  // How big one cell is on the surface this resize came from, in points. Zero means the caller
  // could not measure one.
  //
  // Sent because `resize_step` may be written in points and the daemon resizes a grid, so
  // something has to divide. Only the shell can measure a cell - it belongs to a live surface
  // and moves with the font size - and only the core should do the arithmetic, so the shell
  // reports and the core divides. A caller with no surface sends nothing and gets the daemon's
  // own step, which is a smaller wrong answer than a distance guessed from a font nobody knows.
  float cell_width = 5;
  float cell_height = 6;

  // How wide and tall the whole region is, in points. Zero means the caller could not measure
  // it.
  //
  // The divider moves by a fraction of what it divides, so a distance has nothing to be a
  // fraction of until something reports an extent. The region rather than the pane, because
  // the daemon adjusts the nearest split's ratio and that split's area is the whole region
  // whenever there is one split on the axis - measuring the pane instead would ask for about
  // twice the distance the person wanted. Reported raw, in the same points as the cell, so
  // that all of the arithmetic stays in the core.
  float region_width = 7;
  float region_height = 8;
}

// Makes the text in one pane bigger or smaller, or puts it back.
//
// The pane the keyboard is on, and no other. Muster sized every pane at once until it did not,
// on the argument that a grid you read at a glance is harder to read with ragged cell sizes -
// but the grid is fifteen agents doing different jobs, and the one being read closely is worth
// more room than the one being watched for a colour.
//
// No pane id, unlike ZoomPane. This is a chord and a menu item and nothing else drives it, and
// both of those mean the pane in front of you; a field carrying an answer nothing sends would
// be a second way to ask, published before anybody had a question.
//
// The core holds the size and the shell asks for a direction, which is the same shape as
// ToggleSidebar and for the same reason: what a chord means is "one more than whatever I have",
// and the shell does not know what it has.
message AdjustFontSize {
  // larger, smaller or reset.
  string change = 1;
}

// Reads the config file again, and makes the window match it.
//
// What a relaunch used to be for. Everything a file can say takes effect except which daemons
// are attached: attaching and detaching on a save is a question about live sessions rather than
// about settings, and getting it wrong costs somebody their panes - so a `[[daemon]]` change is
// noticed, reported, and left for a relaunch.
//
// An action rather than something that only happens when the file changes, because the file
// watcher dispatches this rather than being a second path to it. That is what keeps one action
// path honest: a chord, a menu item, a CLI and a saved file all arrive here.
message ReloadConfig {}

// Shows the roster or puts it away.
//
// A toggle rather than a set, matching ZoomPane: what a menu item and a chord both dispatch
// is "the other one", and neither knows which it currently is. The core holds the answer, so
// asking it to flip its own is one round trip fewer than asking it what it has first.
message ToggleSidebar {}

// Makes one pane fill its tab, or puts it back.
//
// A toggle rather than a state, because that is what one key does. What is currently zoomed
// arrives on the view like everything else the daemon owns, so a message that asked for `on`
// would mean reading it back first - a round trip to answer a question the daemon is about to
// answer anyway.
message ZoomPane {
  string daemon_id = 1;
  string pane_id = 2;
}

// The subprocess painting a pane has ended.
//
// An observation rather than a request: a bridge is the shell's own subprocess and its death
// says nothing on its own about whether the daemon still holds the pane. What makes it worth
// sending is that the commonest reason for one to end is that the daemon does not - a pane
// whose terminal has gone - and herdr does not always say so on its own. So this is the
// shell handing over the one piece of evidence it has, and the core decides what it means by
// asking the daemon what it holds.
//
// The pane is named because the shell knows which surface died, and the daemon because two
// daemons hand out the same pane ids.
message BridgeExited {
  string daemon_id = 1;
  string pane_id = 2;
  // Whether libghostty saw a process still alive when it gave up on the surface. Carried for
  // the log rather than branched on: either way nothing is painting this pane.
  bool process_alive = 3;
}

// Show whatever there is to show.
//
// What a bare `muster` asks for, and the ordinary way to open the app: no pane is named, so
// each attached daemon gets a region on the tab it is already focused on. A daemon Muster
// had to start holds nothing at all, and this is what asks it for a first workspace.
//
// Its own message rather than an AttachPane with an empty pane id. Everywhere else in this
// schema an empty pane means "the one this window's keyboard is on", and at open there is no
// keyboard yet - so the same spelling would mean two different things one message apart.
//
// Nothing comes back but Ok. What the window ends up showing arrives as a ViewChanged, like
// every other answer about what is on screen, and a first workspace lands there a moment
// later when the daemon has made it.
message OpenWindow {}

// Moves the line between two regions of the window.
//
// The one piece of layout Muster owns outright rather than mirrors: no daemon knows the
// other one exists, so nothing upstream will ever answer how a laptop and a devenv divide a
// window between them.
//
// Named by the region on the left, unlike SetSplitRatio, which addresses a pane divider by
// the turns down to it. That divider genuinely has no name - it is a position in a tree that
// changes under it - where a region has one, and a request named by an id survives its
// neighbours closing mid-drag instead of quietly moving a different line.
message SetRegionBoundary {
  // The region on the left of the line being moved.
  string region_id = 1;

  // That region's share of itself and its right neighbour together, between 0 and 1. The
  // pair keeps whatever width it had, so nothing further along the window moves. Clamped by
  // the core: a region dragged to nothing would leave no divider to grab and no way back.
  float ratio = 2;
}

// Whether this window has the OS's focus.
//
// The one input to the vocabulary that no daemon can supply and no core can observe. `done`
// is `idle` on a pane nobody looked at, and herdr derives it from the foreground client's
// window focus - which its JSON API has no method for, so a daemon deciding it for a Muster
// window is answering from a client that never reported. The consequence is not cosmetic: an
// agent finishing while this window sits behind a browser reads as `idle`, which says nothing
// needs you at the moment something does.
//
// So the shell reports what only it can see and the core decides what it means. Nothing else
// crosses this seam about focus: which pane the keyboard feeds is Muster's own cursor and
// already travels on the view.
message WindowFocus {
  bool focused = 1;
}

// Splits a pane, putting the new one beside or below it.
//
// The four messages below are the write half of the seam, and the reason it is worth having
// one: a keybinding, a menu item, the CLI and an agent all send these, so a surface that
// cannot express an action is a missing message rather than a missing feature somebody has
// to notice (architecture.md, one action path).
//
// Muster never mutates. Each of these is a request to a daemon, and what actually happened
// arrives afterwards as a ViewChanged - so a shell that renders its own optimistic answer is
// a shell that can be wrong, and none of these carry one.
//
// A pane is named by two things, and every message below that names one says both.
//
// Two daemons hand out the same ids - `w1:p1` means something on each - so a bare pane id
// stops being an answer the moment a window shows more than one daemon. The daemon is
// Muster's own name from the config file, because herdr has no notion of its own identity.
//
// Both halves spell absence as the empty string, and both mean "the one this window's
// keyboard is on", because that is what a keybinding means. The pair is what a menu item
// sends; a click sends what the view it was rendered from said.
message SplitPane {
  string daemon_id = 4;
  string pane_id = 1;

  // Which side of it the new pane lands on: left, right, up or down.
  string side = 2;

  // The existing pane's share afterwards, between 0 and 1. Zero means the daemon's own
  // default, which is what a keybinding wants; a drag-to-split would say. The existing
  // pane's share rather than the upper or left one's, so that one number means one thing
  // on all four sides.
  float ratio = 3;

  // Where the new pane starts. Empty takes the daemon's own rule, which is the directory the
  // split came from - what somebody splitting a pane mid-task means, and why a keybinding
  // sends nothing here. A CLI or an agent placing a pane somewhere particular says.
  string cwd = 5;

  // What to run in it, or empty for whatever a new pane runs anyway.
  //
  // Part of making the pane rather than something to send afterwards, and that is the whole
  // reason it is here. A backend need not be able to spawn a program with a pane - herdr
  // cannot, so this becomes a wait for the pane's shell to draw its prompt and then the text -
  // and a caller that did it itself would be racing that prompt with no way to see it. One
  // call owns the wait, in one place, for every caller.
  //
  // Sent as typed input, so it is what somebody would have typed: a shell line, not an argv.
  string run = 6;

  // What to call it, or empty for nothing.
  //
  // Here rather than left to a second request because the two are one intention - an agent
  // making three panes needs to be able to say which is which - and because a rename that
  // arrived separately would leave the pane briefly nameless in every window showing it.
  string name = 7;

  // Whether this window's keyboard follows the new pane.
  //
  // True is what pressing a key means: you made it, you are looking at it. False is what a
  // script means, and it is the default because the alternative is worse - an agent making
  // three panes would drag the user's cursor through all three, and making a pane is not the
  // same act as looking at one.
  bool take_focus = 8;
}

// Sends text to a pane, whether or not anything is showing it.
//
// Not the keyboard. SendText above is a keystroke's worth of input on its way to the pane this
// window's keyboard feeds, encoded against that pane's live modes; this addresses a pane by
// name and goes out through its daemon. So it reaches a pane in a tab nobody is looking at,
// which is exactly what an agent instructing another agent needs and what no keystroke can do.
message SendToPane {
  string daemon_id = 1;

  // Empty means the pane this window's keyboard is on, as everywhere else - though a caller
  // that means the keyboard usually wants SendText instead.
  string pane_id = 2;

  string text = 3;

  // Whether to press Return afterwards.
  //
  // A separate flag rather than a newline in the text, because the two are different things
  // once a program is reading: Return is encoded against the pane's live modes, and a bare
  // newline inside a bracketed paste is text rather than a submission. A harness that reads
  // one and not the other is the common case, not the exotic one.
  bool enter = 4;
}

// Makes a tab beside a pane, with one pane in it, and shows it.
//
// The unit somebody reaches for several times an hour, and until now the one thing that
// meant dropping to the herdr CLI: splitting was the only way to make a pane, so anything
// that did not belong in the tab you were in had nowhere to go.
//
// A workspace is deliberately not here. It is herdr's unit for a whole project rather than
// something a window makes several times an hour, and Muster makes one only when it would
// otherwise have nothing at all to show.
message CreateTab {
  string daemon_id = 1;

  // The pane whose workspace the tab joins. Empty means the one this window's keyboard is
  // on, which is what a keybinding means.
  string pane_id = 2;

  // Where its pane starts. Empty means that pane's own directory, which is the useful answer
  // mid-flow and the one a split already gives. Unlike a split this is resolved by the core
  // rather than left to the daemon: a new tab has nothing to inherit from, and herdr's own
  // answer is a home directory nobody asked for.
  string cwd = 3;
}

message ClosePane {
  string daemon_id = 2;
  string pane_id = 1;
}

// Points this window's keyboard at a pane, and tells the daemon somebody looked.
//
// Both halves, because they are one thing to the person who clicked. Muster routes input by
// its own view-local cursor and never reads the daemon's back - daemon focus is a single
// value shared with every client, so a herdr TUI in another window could otherwise yank this
// window's keyboard. It is still *written*, because a daemon deciding whether an agent was
// seen is watching it (architecture.md, cursors are written, not read).
message FocusPane {
  string daemon_id = 2;
  string pane_id = 1;
}

// Steps this window's keyboard through the panes it is showing.
//
// A direction rather than a pane, because the caller does not know what is next - the order
// is the tab's tree, which is daemon truth. Resolved in the core so that a keybinding, the
// CLI and an agent all reach the same answer.
message FocusRelative {
  // Two kinds of answer under one word.
  //
  // `next` and `previous` walk reading order across every region and wrap at the ends, so
  // between them they reach every pane - which is what makes them the guarantee.
  //
  // `left`, `right`, `up` and `down` are geometric: the core lays the whole window out from
  // the ratios it already publishes and picks the pane actually in that direction. They do
  // not wrap, because falling off one edge and reappearing at the other is disorienting in a
  // way stepping through an order is not, and reachability is already covered.
  string direction = 1;
}

// Shows the next or previous tab, and puts the keyboard in it.
//
// The other axis to FocusRelative. That one reaches every pane the window is *showing*; this
// one reaches the tabs behind them, which no chord could otherwise get to - clicking a
// sidebar row was the only door, and the sidebar can be put away.
//
// The order is the roster's, so it crosses daemons: a window showing a laptop beside a devenv
// has one list of tabs, and this walks all of it. Both directions wrap, because between them
// they have to reach every tab and that reachability is the point.
message FocusTabRelative {
  // `next` or `previous`. Nothing geometric, because tabs are a list and not an arrangement -
  // there is no tab to the left of a tab.
  string direction = 1;
}

// Puts one pane where another one is, which is what dropping a row on a row means.
//
// One message for both halves of the gesture, because the person dragging made one decision:
// put this agent there. Which request that becomes is the core's to work out from where the
// two panes are - the same tab is an exchange, a different tab is a move - and a shell that
// chose would be a second place that rule lives.
//
// **Both panes must be on the same daemon**, and the shell refuses the drop rather than
// sending this. A pane is a PTY its daemon owns, so moving one to another machine would mean
// killing a process on one host and starting a different one on another; that is not a move,
// and there is no honest thing for the core to do with the request.
//
// The keyboard does not follow. Arranging the list is not going somewhere, and a drag that
// took the keyboard would interrupt whatever is being typed into the pane that had it.
message ArrangePane {
  string daemon_id = 1;

  // The pane being dragged.
  string pane_id = 2;

  // The pane whose row it was dropped on. In the same tab the two exchange places; in another
  // tab the dragged pane joins that tab immediately after this one.
  string onto_pane_id = 3;
}

// Brings a named tab on screen, and puts the keyboard in it.
//
// What clicking a tab caption in the agent list means. Named rather than numbered, unlike
// FocusPaneAt: a click already knows exactly which tab it hit, so a place would be a number
// invented on the way out and resolved back on the way in.
//
// Where the keyboard lands inside it is the core's to decide - the tab's first pane in roster
// order - because going to a tab and reading its rows have to agree about which comes first.
message FocusTab {
  // Empty finds the daemon from the tab. A caller that read a tab's name out of a window has said
  // enough, and which machine holds it is not something a script has any way to know.
  string daemon_id = 1;

  // What Muster calls the tab, as `muster window` prints it. Required, unlike a pane id: there is
  // no "the focused tab" to fall back to, and a request naming neither is a caller that had a tab
  // in hand and dropped it.
  string tab_id = 2;
}

// Puts the keyboard on the pane at a given place in the window's pane order.
//
// What ⌘1 to ⌘9 mean. The place is the roster's numbering, counting from one across every
// attached daemon and every tab, so it is the number the sidebar draws beside the row.
//
// A pane in a tab nothing is showing brings that tab on screen, because focusing a pane
// surfaces it - which is why numbering panes reaches every tab too, and why there is no
// numbered chord for a tab.
message FocusPaneAt {
  // Counting from one. A place past the last pane does nothing, rather than landing on the
  // last one: ⌘9 meaning something different every time a pane opened would be worse than ⌘9
  // meaning nothing until there are nine panes.
  uint32 place = 1;
}

// Moves one divider in a tab's tree.
message SetSplitRatio {
  // Empty finds the daemon from the tab, as everywhere a tab is named: a tab name is Muster's own
  // and unique across every attached machine, so it cannot mean two tabs.
  string daemon_id = 4;

  // What Muster calls the tab, as `muster window` prints it.
  string tab_id = 1;

  // The turns from the tab's root down to the divider: false takes the first child, true the
  // second. A divider has no id - it is a position in a shape that changes under it - so it
  // is addressed by the way there, which the shell reads straight off the tree it rendered.
  repeated bool path = 2;

  // The first child's share afterwards, between 0 and 1.
  float ratio = 3;
}

// Everything the core answers.
//
// A request the core understood and refused is a Failure, not a missing response: the
// shell has nowhere better to put an error than the log this seam already carries.
message Response {
  oneof payload {
    Ok ok = 1;
    Failure failure = 2;
    Attached attached = 3;
    Bindings bindings = 4;
    Appearance appearance = 5;
    Findings findings = 6;
    Window window = 7;
    Made made = 8;
    WindowFrame window_frame = 9;
  }
}

// The pane a request made.
//
// A split answers with this rather than a bare Ok, because a caller that cannot learn what it
// made cannot do anything with it: a script's next line names this pane, and an agent's whole
// use of a split is to send something into what it produced. Nothing else changes - the window
// still learns the arrangement from the daemon's own events - so this is the one fact a caller
// could not have got any other way.
message Made {
  string pane_id = 1;
}

// Everything about a window at one moment: what it draws, what it holds, and how the agents in
// it are doing.
//
// The four messages a shell is sent as events, gathered into one answer. Reused rather than
// restated: a second vocabulary for "this pane's agent is blocked" would be two places to keep
// in agreement about what the words mean, and the point of answering from the same builders is
// that a read cannot contradict the stream.
message Window {
  ViewChanged view = 1;
  RosterChanged roster = 2;

  // Every pane every followed daemon holds, on screen or not, and what this window would paint
  // for it. A pane running an ordinary shell is `unknown`, the same word as an agent whose
  // harness could not be read - the daemon draws no distinction and neither does this.
  //
  // What the window would paint, not what the daemon said: `done` is decided per window,
  // because a daemon cannot see which window somebody has looked at.
  repeated PaneStateChanged panes = 3;

  // How much of each daemon's truth Muster currently has.
  //
  // Here because the rest of this answer is a mirror, and a mirror nobody has heard from in an
  // hour looks exactly like a current one. A caller told a window's shape and not told that is
  // a caller acting on a picture Muster itself does not vouch for.
  repeated BackendHealth daemons = 4;
}

// What a search found, which is everything a find bar draws.
//
// Counts rather than the matches themselves. The bar shows "3 of 47" and the renderer
// highlights what is on screen by looking for the needle again itself, so nothing above the
// core needs to know where a match is - and a common needle over a thousand rows would be
// thousands of positions crossing this seam per keystroke.
message Findings {
  uint32 total = 1;

  // Which match is selected, counting from one. Zero when nothing matched, which is already
  // the answer to "which of nothing" and needs no separate flag.
  uint32 selected = 2;

  // How many rows were looked at, which is what the bar can honestly claim to have covered.
  uint32 rows_searched = 3;

  // Whether the pane holds history this search never reached.
  //
  // The reason the bar can say so only when it is true. A search that covered everything
  // should say nothing at all, and a confident "no results" over a fifth of a long pane is
  // the failure this whole feature was written around.
  bool truncated = 4;
}

// Every action Muster has, and the chord asking for it.
//
// In menu order rather than alphabetical: a menu is read top to bottom, and making something
// then arranging it then moving around it is what somebody scanning one expects.
message Bindings {
  repeated Binding bindings = 1;
}

message Binding {
  // What Muster calls the action - `split_right`, `zoom`. The same word a config file binds
  // and a log line names, so a shell maps this to whatever it dispatches with.
  string action = 1;

  // The physical key, as the W3C UI Events code standard names it: `KeyD`, `ArrowLeft`,
  // `Enter`. A key rather than a character, because a chord is a place on the keyboard - and
  // what a layout produces there travels separately as text.
  string key = 2;

  // shift, control, alt, super. Absent rather than false, and never the side bits: a chord is
  // the same chord whichever command key supplied it.
  repeated string modifiers = 3;
}

message Ok {}

message Failure {
  // Written for whoever reads it in a log at 2am: what broke, what it costs, what to
  // check. Not an error code - the seam has no failures a caller can branch on, and
  // pretending otherwise would invite handling instead of reporting.
  string reason = 1;
}

// What the core cannot work out for itself, handed over once at launch.
message Startup {
  // Where this run's log file goes. Empty turns logging off, which is what a release build
  // does unless asked otherwise. The shell decides because where logs belong is an OS
  // question (architecture.md, the diagnostic log).
  //
  // The shell also exports this as MUSTER_LOG_FILE so that bridges inherit it. That is a
  // different mechanism for a different process, not a duplicate of this field: a bridge
  // is spawned, not dispatched to.
  string log_path = 1;

  // The config file to read, or empty for none. The shell decides where it lives for the
  // same reason it decides where the log goes; the core decides what it means.
  //
  // Empty is the ordinary case rather than a problem: a Muster with no config file attaches
  // the daemon on this machine the way herdr's own client would find it.
  string config_path = 4;

  // The daemon binary this Muster ships, or empty if the shell found none.
  //
  // Muster runs its own daemon rather than asking anybody to install one, and it runs the
  // version it shipped rather than whatever is on PATH - a daemon the corpus was never
  // recorded against is a window whose every behaviour is unverified. Where that binary sits
  // is an OS and packaging question, which is why the shell answers it: inside the bundle for
  // a shipped app, beside the executable for a build.
  //
  // Empty is not a default to paper over. It means this build staged no daemon, and a window
  // that then finds none running has nothing to show and says so.
  string daemon_path = 5;

  // Where this window's arrangement is remembered, or empty to remember nothing.
  //
  // The one thing Muster owns that no daemon can answer: which of its tabs this window was
  // showing, in what order, at what widths. Written on change and read at open, so the window
  // comes back the way it was left rather than the way a first launch looks.
  //
  // The shell decides where it goes for the same reason it decides where the log does. Empty
  // is a real state rather than a failure - a window that cannot find anywhere to write opens
  // fresh every time, which is what it did before this existed.
  string state_path = 6;

  // What locale this machine is set to, as a POSIX name like `en_AU.UTF-8`. Empty when the
  // platform would not name one.
  //
  // Reported rather than obeyed: what the core does with it is the core's, and today that is
  // handing the daemon a LANG when nothing else supplied one. The split is the same one the
  // log path draws - only the shell can ask macOS what the user picked, and only the core
  // decides what a daemon is entitled to.
  //
  // Here because a window launched from the Dock has no environment worth the name. launchd
  // hands a GUI process HOME, PATH, SHELL, USER, LOGNAME, TMPDIR and little else - no LANG,
  // no LC_* - and an allowlist can only carry what exists. Today the renderer's own startup
  // happens to leave a locale in the process before the daemon is started, which is a loan
  // rather than an answer; `daemon::supplied` says why Muster gives its own.
  string locale = 7;

  // Where Muster writes the config file its own daemon reads, or empty for nowhere.
  //
  // The backend's half of the arrangement the renderer already has. herdr takes a value only
  // as a file, so Muster derives one from its own config and names it with HERDR_CONFIG_PATH -
  // which moves the file the daemon reads without moving the socket it binds. That is what
  // stops a `default_shell` somebody set for their own terminal deciding what every Muster
  // pane runs, and what keeps a daemon pinned by checksum from looking for its own updates.
  //
  // The shell decides where it goes for the same reason it decides where the arrangement does.
  // Empty is a real state: the daemon then reads the user's own herdr config, which is what it
  // did before this existed, and the run log names which file is in play.
  string daemon_config_path = 8;

  // Where Muster remembers what it calls each pane, or empty for nowhere.
  //
  // Panes outlive the app, so an agent that has been running since before Muster was last
  // quit still has a name in its environment - and if this file is not read back, that name
  // resolves to nothing and every command from inside that pane is refused.
  //
  // The same division as state_path, and beside it in the same directory. Empty is a real
  // state: names then last exactly one launch, which is what they did before this existed.
  string pane_names_path = 9;

  // Where to listen for requests from outside this process, or empty for nowhere.
  //
  // The same Request the shell sends over the C ABI, arriving on a unix socket instead. That
  // is what lets a script or an agent in a pane drive the window it is sitting in, which no
  // amount of talking to a daemon can do: a daemon knows its own panes and nothing about
  // regions, tabs, focus, or the other daemon this window also shows.
  //
  // The path carries this process's pid, because two Musters are two windows and a caller has
  // to be able to reach the one it means. Empty is what every test gets and what a build with
  // no endpoint wanted - the window then answers only its own shell.
  string command_socket_path = 10;

  // The directory Muster keeps its own commands in, or empty for none.
  //
  // Put on the PATH of every daemon the core starts, and so on the PATH of every pane those
  // daemons spawn. That is the whole of how a program inside a pane comes to be able to run
  // `muster` at all: the alternative is asking every user to install something, which makes the
  // surface taught rather than found.
  //
  // The shell decides where it goes and puts a link to this build's CLI in it, for the same
  // reason it decides where the log goes. Empty is a real state and not a failure - this build
  // staged no CLI, or there is nowhere to write one, and then a pane simply has no `muster` and
  // the window works exactly as it did before this existed.
  string commands_path = 11;

  // Where Muster keeps what it downloaded, or empty for nowhere.
  //
  // One thing needs this, and it is the daemon on a machine that is not this one. Muster runs
  // the herdr it pinned rather than whatever is installed, and four platforms are pinned while
  // a build carries one - so attaching an SSH endpoint means fetching that machine's asset and
  // pushing it over the connection already open. Downloaded here rather than over there because
  // whoever is running Muster demonstrably has web access and a devenv often has no route out.
  //
  // The shell decides where it goes for the same reason it decides where the arrangement does.
  // Empty is a real state and not a failure: the fetch then goes to a temporary that is thrown
  // away, so a machine with nowhere to cache pays for the download on every launch that has to
  // install - slow rather than broken.
  string cache_path = 12;

  // trace, debug, info, warn, error. Empty means debug.
  string log_level = 2;

  // Names this process in every record it writes. The bridges use their own.
  string process = 3;
}

// One thing that happened, on its way to the file the core owns.
//
// The shell logs through the seam rather than writing its own file, so that one writer
// owns the format, the truncation rule and the ordering. `event` is a dotted name rather
// than a sentence - `channel.connected`, not "the channel connected" - so finding every
// instance is a grep instead of a guess at how it was worded.
message LogRecord {
  string level = 1;
  string event = 2;
  map<string, string> fields = 3;
}

// Point this window's keyboard at a daemon-owned pane.
//
// Everything about what a keystroke means lives behind this: the core opens the socket the
// pane's bridge will dial, finds the daemon if there is one, and owns the keymap and the
// encoder from here on. The shell's remaining job is to say that a key was pressed.
// No daemon here either, and for the opposite reason: at attach nobody knows yet. This is
// the bootstrap, before any daemon is being followed, so the core finds which one holds the
// pane. It stops being unambiguous the day a window attaches several daemons that both hold
// a `w1:p1`, and gains a daemon then rather than now.
message AttachPane {
  string pane_id = 1;
}

// The pane is attached, and here is what the shell needs to finish standing it up.
message Attached {
  // Where the bridge should dial back. Chosen by the core because it is the core's
  // listener; the shell only relays it onto the bridge's command line.
  string control_socket_path = 1;

  // What the backend calls the pane that was attached, for the reason
  // `ViewPane.backend_pane_id` carries one: the bridge talks to the daemon directly. Answered
  // here so whatever asked for the attachment has both spellings without a second lookup.
  string backend_pane_id = 2;
}

// A keystroke, with the fidelity a terminal encoder needs and nothing else.
//
// Names rather than numbers throughout, because this vocabulary has to survive leaving the
// process - into the conformance corpus, into the log, and into a CLI. `520` in a case file
// tells a reader nothing, and silently means something else if bits are ever renumbered.
message KeyEvent {
  // press, release, or repeated. Repeat is distinct because the kitty protocol reports it
  // separately and a program tracking held keys needs the difference.
  string action = 1;

  // The physical key, as the W3C UI Events code standard names it: KeyA, ArrowUp, Digit0.
  // Layout-independent - what the layout produced travels separately as `text`.
  string key = 2;

  repeated string modifiers = 3;

  // The modifiers the keyboard layout already spent producing `text`. Encoders must not
  // report these a second time: on a German layout option+8 produces `{`, and an encoder
  // told both "option is down" and "the text is {" sends alt+{ instead of a brace.
  repeated string consumed_modifiers = 4;

  // What the layout produced, if anything. Empty for keys with no text, such as arrows.
  string text = 5;

  // The codepoint this key produces with no modifiers at all, which the kitty protocol
  // reports so an application can recognize a chord by the key printed on the cap.
  optional uint32 unshifted_codepoint = 6;

  // Whether an input method is mid-composition. A composing keystroke belongs to the input
  // method, not the pane: encoding it would deliver the romaji as well as the result.
  bool is_composing = 7;

  // What the layout would have produced if option had not been part of the translation.
  // Only meaningful on macOS and only while option is down, because option is two things
  // there: a modifier, and a key that composes characters. Which one it is for a given user
  // is configuration, and only the layout can say what the other reading would have been -
  // `opt+shift+t` is `‡` under one and `T` under the other. The shell reports both readings
  // rather than choosing, and the core picks knowing what the config file said.
  string text_without_option = 8;
}

// A key press, as it looked after the input method had its turn.
//
// The three composition signals travel with the keystroke rather than being resolved by the
// shell, because picking between them is a decision and the shell makes none. Picking
// *both* is the failure mode - committed text and an encoded keystroke are two renderings
// of one press, and sending both is how `hello` arrived as `hheelllloo`.
message KeyDown {
  KeyEvent key = 1;

  // Whether a composition was already in progress before this press.
  bool was_composing = 2;

  // Text the input method handed over during this press, if any. Absent and empty mean
  // different things: absent is "the method committed nothing".
  optional string committed = 3;

  // Whether a composition remains in progress afterwards.
  bool still_composing = 4;
}

// A key release.
//
// Only reported when the pane asked for release events, which the encoder decides from the
// mode profile - sending them unconditionally is how a program that never asked ends up
// with every keystroke twice.
message KeyUp {
  KeyEvent key = 1;
}

// Text with no keystroke behind it - a character picker, a service, a committed
// composition.
message SendText {
  string text = 1;
}

// The clipboard, on its way to the pane.
message Paste {
  string text = 1;
}

// A wheel movement, which the daemon routes against the pane's mouse mode. Never encoded
// here: a frame stream has no history, so surfaces hold no scrollback.
// A wheel notch or a trackpad gesture, as the device reported it.
//
// The magnitude is the device's own number and stays that way across the seam: a trackpad
// reports many small deltas and a wheel mouse a few large ones, and how many lines that is
// worth is a decision - `scroll_multiplier` scales it and the core rounds it. A shell that
// turned a delta into lines for itself would be a second place that answer lives, and the
// two would drift the moment either changed.
//
// The pane is named because a wheel moves what the pointer is over rather than what the
// keyboard is in - reading one agent's output while typing into another is the ordinary case
// in a window of fifteen. That is the one thing separating this from every other input
// message here, all of which mean the focused pane. The daemon comes with it because two
// daemons hand out the same pane ids.
message Scroll {
  string daemon_id = 3;
  string pane_id = 4;

  string direction = 1;  // up or down
  double delta = 2;
}

// What the core tells the shell without being asked.
//
// Delivered through the callback registered at startup, from whichever thread noticed.
// Nothing here is a reply to anything.
message Event {
  oneof payload {
    PaneTypeable pane_typeable = 1;
    PaneStateChanged pane_state_changed = 2;
    BackendHealth backend_health = 3;
    ViewChanged view_changed = 4;
    RosterChanged roster_changed = 5;
    PresentationChanged presentation_changed = 6;
    AppearanceChanged appearance_changed = 7;
    BindingsChanged bindings_changed = 8;
    ProblemsChanged problems_changed = 9;
  }
}

// What is wrong with this window, whole.
//
// Sent whole rather than as one problem arriving or leaving, on the same terms as
// RosterChanged and ViewChanged and for the same reason: clearing is then an empty list, and
// there is no add-and-remove protocol for a shell to fall out of step with. Sent once at
// startup too, like PresentationChanged, so a shell never has to guess a default.
//
// Sending it whole is also what lets a launch report one. An event cannot reach a shell
// during startup - that is the split AppearanceChanged describes, where a launch asks and a
// reload is told - but a problem raised before the event loop existed is still outstanding
// once it does, so the first publication carries it. One mechanism covers both moments,
// which is what keeps a config refused at launch from being reported differently to one
// refused on save.
message ProblemsChanged {
  repeated Problem problems = 1;
}

// One thing that is wrong, worst first in the list above.
message Problem {
  // Names the condition rather than the occasion, so the same thing found twice is one
  // problem. A file saved ten times with one typo raises `config.refused` ten times and is
  // one entry here, which is what stops a watcher from nagging.
  string key = 1;

  // `error` or `warning`. The split is what somebody has to do, not how bad it is: an error
  // will not recover without a human edit and opens a sidebar that was closed, a warning is
  // content to be found when somebody next looks. See `problems.rs` for why there is no
  // third level.
  string severity = 2;

  // What to tell the person, in the words of whatever found it. Muster's own refusals
  // already name the file, the value, what stopped working and what to type instead, so
  // this is passed through untouched rather than summarized.
  string detail = 3;
}

// What Muster should look like, after the config file was read again.
//
// The event half of ReadAppearance, and the reason that message's comment said "when it can
// change, it becomes an event". Both exist, and the split is between the two moments rather
// than redundant: a launch needs the answer before the renderer is built and before any event
// loop is running, so it asks; a reload happens while the window is up, so the core tells it.
message AppearanceChanged {
  Appearance appearance = 1;
}

// Which chord means what, after the config file was read again.
//
// The same pairing as AppearanceChanged, for the same reason. On macOS this rebuilds the menu,
// which is the whole of rebinding there - a key equivalent on a menu item is how the platform
// decides what a chord means.
message BindingsChanged {
  Bindings bindings = 1;
}

// The window's own chrome, as the core decided it.
//
// Separate from ViewChanged because it answers a different question and changes on a
// different schedule: a view moves whenever a pane does, and this moves when somebody asks
// for it. Sent whole, and sent once on startup so a shell never has to guess a default.
message PresentationChanged {
  // Whether the roster is on screen.
  bool sidebar = 1;

  // 2 was a font size for the whole window, from when `cmd+=` sized every pane at once. Text
  // is sized per pane now and travels on `ViewPane.font_size_offset`, where the shell is
  // already reading to build the surface it would apply it to.
  reserved 2;
}

// Every pane every attached daemon holds, whether or not this window is showing it.
//
// The view says what is on screen; this says what exists. Both, because the desideratum is
// that every agent is glanceable and the pane most likely to have finished unnoticed is the
// one no region is showing - a list of only what is visible would leave exactly those out.
//
// Structure only, on the same terms as ViewChanged and for the same reason: what an agent is
// doing travels on PaneStateChanged, because a roster is mostly stable and a state blinks.
// A shell holds both and joins them, which it already does to paint a pane's border.
//
// Whole list every time, absolute and idempotent. It is a few dozen short rows for a window
// nobody can fill past about fifteen panes, and a shell handed the whole answer keeps no
// picture of its own to patch.
// Daemon, then tab, then pane, because a flat list of panes cannot say which of them sit
// side by side in one tab - and a window shows one tab per region, so the tab is what a
// person navigates between. The nesting is decided here rather than rebuilt by each reader,
// on the same terms as the order and the labels.
message RosterChanged {
  // Daemons in the order their regions sit in the window, then any daemon with no region.
  repeated RosterDaemon daemons = 1;
}

message RosterDaemon {
  string daemon_id = 1;

  // In the order the daemon holds them, which is also the order they are numbered in.
  repeated RosterTab tabs = 2;
}

message RosterTab {
  string daemon_id = 1;

  // What Muster calls this tab - `t1w3r07bsd` - and what every tab id in this schema means.
  // Minted by Muster rather than borrowed from the backend, and unique across every attached
  // machine, so it is what a script or an agent addresses a tab by. Unlike a pane there is no
  // backend spelling beside it: nothing outside the core ever names a tab to a daemon, because
  // no bridge streams one.
  string tab_id = 2;

  // Where this tab sits in the window's whole tab order, counting from one. The order
  // next_tab walks, counted across every daemon rather than within one. It is what a tab
  // nobody named is called, and under the scheme Muster ships no chord names it - ⌘1 to ⌘9
  // number panes. Whether one does at this moment is `number` below, not this.
  uint32 place = 3;

  // Which numbered chord reaches this tab right now - 2 means ⌘2 gets you here - and 0 when
  // none does, which is the ordinary answer and what every tab carries under the settled
  // scheme. Distinct from `place` above, which is where the tab sits whether or not anything
  // can reach it by number.
  //
  // Sent per row rather than as a mode beside the list, because "which chord reaches this
  // row" is the question a sidebar is drawing the answer to, and a mode plus a place is two
  // things a reader could combine differently from the way the core did.
  uint32 number = 8;

  // What to call this tab to somebody who did not open it: the workspace it belongs to when
  // the daemon holds more than one, and the tab's own name otherwise.
  string label = 4;

  // Whether a region is showing this tab right now. Not the same question as any of its
  // panes being on screen: a zoomed tab is on screen while all but one of its panes are not.
  bool on_screen = 5;

  // In the order this tab's tree lays them out.
  repeated RosterPane panes = 6;

  // The name somebody gave this tab, empty when nobody has. Not recoverable from `label`,
  // which may carry the workspace in front of it - a rename has to start from what was
  // typed rather than from what is drawn.
  string given_name = 7;
}

message RosterPane {
  string daemon_id = 1;
  string pane_id = 2;

  // What to call this pane to somebody who did not open it - the name somebody gave it, or
  // failing that its directory and the harness detected in it. Decided in the core, because
  // a shell naming panes for itself would be a second place that decision lives.
  string label = 3;

  // Whether a region is showing it right now. Resolved here rather than left to a shell
  // comparing this against the view: the two arrive separately, and a shell joining them
  // would render a pane as hidden for as long as they disagreed.
  bool on_screen = 4;

  // What this pane's agent is working on, empty when there is nothing worth a second line.
  //
  // Empty is the ordinary answer and the reason this is affordable: a line under every row
  // doubles the height of a list whose value is being glanceable, so the core draws one only
  // for a pane with a detected harness whose title says something the label does not.
  string subtitle = 5;

  // The name somebody gave this pane, empty when nobody has. Carried so a rename can start
  // from what it is already called rather than from a label nobody typed.
  string given_name = 6;

  // Where this pane sits in the window's whole pane order, counting from one. The handle ⌘1
  // to ⌘9 name, counted across every daemon and every tab - the sidebar is one list, and a
  // person reading it counts down the whole thing.
  //
  // Numbered past nine even though no chord goes that far: the number is what the pane's
  // position is, and how far to draw them is the sidebar's decision.
  uint32 place = 7;

  // Which numbered chord reaches this pane right now, 0 when none does. Under the settled
  // scheme this is `place` for the first nine panes and 0 after that; under the prototype
  // `numbered_chords` turns on, it is 0 until a chord has named this pane's tab. See
  // RosterTab.number.
  uint32 number = 8;
}

// Everything this window is showing, as one message.
//
// The whole view every time, absolute and idempotent, in the same discipline as the
// daemon's own events. That is what lets the shell stay dumb: it renders what it is handed
// and keeps no picture of its own to patch, so there is no state up there to drift.
//
// Structure and identity only. What an agent is doing travels on PaneStateChanged, because
// a pane's state moves far more often than the arrangement it sits in and carrying it here
// would repaint the tree every time an agent blinked - and because that field already has
// exactly one writer, which is the property that keeps it correct.
message ViewChanged {
  // In the order they are laid out. Muster owns no split tree over regions; side by side,
  // in this order, is the whole arrangement.
  repeated ViewRegion regions = 1;

  // Which region's pane the keyboard feeds. Empty when none does, which is what a window
  // with no daemon behind it looks like.
  string focused_region = 2;
}

// One region, showing one tab's pane tree.
message ViewRegion {
  string region_id = 1;
  string daemon_id = 2;

  // What Muster calls the tab this region shows. See RosterTab.tab_id.
  string tab_id = 3;

  // The pane in this region the keyboard feeds while the region is focused. Empty when the
  // daemon has not yet said what is in this tab.
  string pane_id = 4;

  // How much of the window's width this region gets, relative to the others. A weight rather
  // than a fraction, so a shell divides by the sum and needs no other region's business - and
  // so the list stays a list. Every region starts at 1, which is what equal shares are.
  float weight = 9;

  // Absent while the daemon has not said how this tab is arranged, which is an ordinary
  // moment rather than a failure - the tree arrives on its own event. Absent and "no panes"
  // are different answers: a shell told this leaves its surfaces alone, where a shell told
  // the tab is empty would tear down surfaces that are about to be described.
  ViewNode root = 5;

  // Whether `root` is one pane filling the region rather than the tab's whole tree. Already
  // resolved, so a shell that ignores this renders the right thing; it exists so the chrome
  // can say so, because a zoomed tab and a one-pane tab are otherwise identical on screen.
  //
  // The pane filling it is `pane_id` above - the one this window's keyboard feeds. A backend
  // spells zoom as a flag beside its own focused pane, and that cursor is shared with every
  // client, so which pane fills the region is Muster's answer rather than the daemon's.
  bool zoomed = 6;

  // How this region's panes are reached, when they are on another machine. Both empty means
  // a daemon on this machine, which is the only difference a shell has to notice between
  // local and remote: it relays these onto the bridge's command line and nothing else here
  // changes.
  //
  // On the region rather than on each pane because it is a property of the daemon, and every
  // pane in a region belongs to one.
  string ssh_host = 7;

  // The ssh master's control socket. A pane's frames come from a command rather than from
  // the forwarded socket - herdr publishes them through its CLI - so the bridge runs that
  // command through the connection the control plane already opened, instead of paying for a
  // handshake per pane.
  string ssh_control_path = 8;

  // Which daemon this region's frame streams should come from, on this machine.
  //
  // Where the backend holding this region listens, for the bridge that will dial it.
  //
  // Named for the backend rather than for the one Muster ships, on the rule the renderer
  // seam already follows: nothing herdr-shaped reaches the schema, because a replacement
  // would otherwise inherit a field lying about which daemon it names. The bridge's own CLI
  // flag still says herdr, and belongs to the adapter that spawns it.
  //
  // A bridge finds a daemon the same way any other client does - which is not good enough
  // now that Muster runs its own on a session of its own. A bridge left to find one for itself reaches whatever the user last
  // started, does not find the pane there, and the stream ends before a single frame: a pane
  // that renders nothing, which is this project's most expensive failure shape.
  //
  // Empty for a remote region, and not an oversight: that bridge runs its CLI on the far
  // machine, where this path names nothing. It finds the daemon over there the ordinary way,
  // which is the same asymmetry the control plane already has until Muster ships a daemon to
  // the far end too.
  string backend_socket = 10;
}

message ViewNode {
  oneof node {
    ViewPane pane = 1;
    ViewSplit split = 2;
  }
}

message ViewSplit {
  // columns (children side by side, first is left) or rows (first is upper). Muster's
  // spelling, not a backend's: herdr says right and down, which describe the moment of
  // splitting rather than how to lay two children out long afterwards.
  string axis = 1;

  // The first child's share of the region, between 0 and 1. Proportions rather than cells,
  // because a backend sizes its rectangles for a viewport of its own.
  float ratio = 2;

  ViewNode first = 3;
  ViewNode second = 4;
}

// No daemon here, deliberately, though a pane needs one to be named unambiguously: a
// ViewPane only ever arrives inside the ViewRegion that carries it, so a shell walking the
// tree already has the answer and repeating it would be a second copy to disagree with.
message ViewPane {
  // What Muster calls this pane - `p1w3r07bsd` - and what everything else in this schema means
  // by a pane id. Minted by Muster rather than borrowed from the backend, so that a pane can be
  // told which pane it is before the backend has named it (crates/muster-core/src/names.rs).
  // Unique across every attached machine, so it is an answer on its own.
  string pane_id = 1;

  // Where this pane's bridge should dial the core. Empty means no channel is open for this
  // pane yet, and a surface built from it would render and never be typeable - so a shell
  // must not spawn a bridge pointed at it.
  string control_socket_path = 2;

  // What the *backend* calls this pane, for the one thing the shell does that reaches a backend
  // rather than the core: spawning the bridge, which streams frames straight from the daemon and
  // is given this on its command line.
  //
  // Here on exactly the terms `ViewRegion.backend_socket` is - a handle the shell relays and
  // never interprets. Addressing a pane by it would be a second vocabulary, and the two disagree
  // the moment two daemons are attached: herdr numbers panes per session, so a laptop and a
  // devenv both hold a `w1:p1`.
  string backend_pane_id = 3;

  // Points to add to the font size this pane's text is drawn at.
  //
  // An offset rather than a size, because the core does not know the size it is offsetting
  // from - `[font] size` is optional, and when it is absent the number belongs to the renderer
  // and never crosses back. Zero is a pane nobody has sized, and is what most panes report.
  //
  // On the pane rather than on a message of its own, although it is chrome rather than daemon
  // truth. A shell builds a surface from a leaf, so a second message would be one the shell
  // had to join against this one - and a pane would be drawn at the wrong size for as long as
  // the two disagreed, which is the rule `RosterPane.on_screen` already states.
  //
  // Per pane rather than per window, which is where this differs from what Muster used to do.
  // The old answer sized every pane at once, on the argument that a grid you read at a glance
  // is harder to read with ragged cell sizes; the grid is fifteen agents doing different jobs,
  // and being able to say which one you are reading closely is worth the raggedness.
  int32 font_size_offset = 4;
}

// What the agent in a pane is doing now.
//
// One pane per message rather than a picture of the session, because the shell renders
// chrome and owns nothing. When splits need the whole tree, that is a message for the
// tree, and this stays what it is.
//
// Sent for every pane the daemon holds, not only the one this window is attached to: a
// window showing one pane still logs the others, and the sidebar that displays them is the
// same feed with somewhere to put it.
message PaneStateChanged {
  // Unlike a ViewPane, which arrives inside the region that names its daemon, this travels
  // on its own - so it carries the daemon rather than leaving the shell to guess which
  // `w1:p1` went to work.
  string daemon_id = 3;
  string pane_id = 1;

  // working, blocked, idle, done, or unknown. Never empty - a pane whose harness the
  // backend cannot classify is `unknown`, which renders as itself. An agent we failed to
  // read is not an agent that finished.
  string state = 2;
}

// How much of the backend's truth the core currently has.
//
// A state rather than an error, because a stale mirror still renders and should say so.
// The window that silently shows an hour-old session is worse than the one that admits it,
// and both look identical without this.
message BackendHealth {
  // Which daemon this is about. Health is per-connection and there is one of these per
  // daemon: a window showing a laptop and a devenv has two answers, and reporting one for
  // the window would let a dropped VPN read as though everything had gone.
  string daemon_id = 3;

  // connected, stale, or disconnected.
  string state = 1;

  // Why, for the title bar and the log. Empty when connected.
  string detail = 2;
}

// A pane's bridge dialed back, so keystrokes now have somewhere to go.
//
// The single most useful fact in the log when typing does nothing, and the reason the push
// direction exists at all: it becomes true on a socket accept, long after the shell
// finished asking about it.
message PaneTypeable {
  string daemon_id = 2;
  string pane_id = 1;
}
